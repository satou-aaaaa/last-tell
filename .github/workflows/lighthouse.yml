name: Lighthouse

# 公開中のページの速さ・使いやすさ（Lighthouse の点数）を週1回測る。Claude は使わない。
# 基準（baseline）から決めた幅より下がったら失敗にする。
# 速さは外の都合で揺れやすいので、ci-failure-issue.yml の見張り対象には入れない（失敗しても CI 失敗の Issue は立たない）。
# 中身は共通部品 satou-aaaaa/shared-workflows にある。点数が良くなって定着したら baseline を上げてよい。
on:
  schedule:
    # 毎週月曜 06:37 JST（= 日曜 21:37 UTC）。tenbin・naitei-no-michi と時間をずらす
    - cron: "37 21 * * 0"
  workflow_dispatch:
  # このファイルを変えた PR では1回測って、呼び出しが動くことを確かめる（測るのは公開中のページ）
  pull_request:
    paths:
      - .github/workflows/lighthouse.yml

permissions:
  contents: read
  pages: read

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  measure:
    uses: satou-aaaaa/shared-workflows/.github/workflows/lighthouse.yml@main
    with:
      baseline: '{"performance": 70, "accessibility": 90, "best-practices": 90, "seo": 90}'
      # 基準から何点まで下がってよいか（速さは測るたびに揺れるので幅を広く）
      margin: '{"performance": 20, "accessibility": 10, "best-practices": 10, "seo": 10}'
