name: CI failure issue

# main で下のワークフローが失敗したらラベル ci-failure の Issue を立て、次に成功したら閉じる（Claude は使わない）。
# 監督エージェントが毎回 API で失敗を探す代わりに、この Issue を見るだけで済むようにするためのもの。
# 注意：GITHUB_TOKEN で起きた実行（Auto merge が起こす公開後の QA など）は workflow_run が起きないので、ここでは見張れない。
# QA の main の ❌ は qa.yml の「検査のまとめ」が自分で Issue を立てる（改善提案 第11回 0-1、2026-10-20）。
# 中身は共通部品 satou-aaaaa/shared-workflows にある。ここには見張るワークフローの名前（name:）だけを書く。
on:
  workflow_run:
    workflows: ["QA", "Pages", "通しで遊ぶ", "Release tag", "Site watch", "Changes", "Link check", "Secret scan", "Post-deploy check", "Setup check"]
    types: [completed]

permissions:
  issues: write
  actions: read

jobs:
  report:
    uses: satou-aaaaa/shared-workflows/.github/workflows/ci-failure-issue.yml@main
