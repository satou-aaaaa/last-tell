# ゲーム（index.html）と、ゲームが開くページ（規約など・sw.js・licenses/）が変わるたびに検査（qa/）を回す。
# テスト公開はプルリクエストで出して、✅ を見てからマージする。
# 2026-10-14「検証をCIに寄せる」：重い検査（全部の検査・勝率・3つの画面の撮影・基準との比べ）はここで回し、
# Claude のスレッドは結果を読むだけにする。結果は ブランチ qa-results（pr/<番号>/・v<版>/）に置く
# （Claude の環境からは Actions の成果物を落とせないため）。読み方は qa/ci_result.sh。
name: QA

on:
  pull_request:
    # 下書きを外したときも回す（回らないと自動マージが起きない）
    types: [opened, synchronize, reopened, ready_for_review]
    # 全部の PR で回す（ルールセットで「検査のまとめ」を必須にするため。CIのチェック充実 案7）。
    # ゲームも検査も変わっていない PR は「検査の一覧」が見て、重い組を飛ばす
  push:
    branches: [main]
    paths: ['*.html', 'sw.js', 'style.css', 'licenses/**', 'qa/**', '.github/workflows/qa.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '長い版で回す（公開・ストア提出の前）'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

# 検査の組（時間のかかる検査を分けて、同時に回す）。CIの見直し 案2・案3（2026-10-10）
# 新しい検査を qa/ に足したら、ここのどれかの組に入れる。入れ忘れると「検査の一覧」が ❌ になる
# nobrowser: ブラウザを使わない組（Playwright と字体を入れない。数秒で終わる）
# browser: webkit の組は iPhone の Safari と同じ WebKit で回す（CIのチェック充実 案3。画面の新しい問題は ⚠️、止まる・エラーは ❌）
# nightly: ここでは回さない組（通しで遊ぶ。1時間かかるので playthrough.yml が毎晩回す）
# full: 長い版のときだけ回す組。長い版の勝率は1章24回（約25分）なので、1章ずつ分ける
# 長い版になるのは、手で「長い版」を選んだときと、公開のブランチ（publish-…）のプルリクエスト
env:
  QA_GROUPS: >-
    [
      {"name": "unit（ルールの単体テスト）", "only": "unit", "ch": "", "nobrowser": true},
      {"name": "text,script,lines,ftue,a11y,perf,save,pages", "only": "text,script,lines,ftue,a11y,perf,save,pages", "ch": ""},
      {"name": "ui,uiux", "only": "ui,uiux", "ch": ""},
      {"name": "fuzz", "only": "fuzz", "ch": ""},
      {"name": "WebKit（iPhone の Safari）ui,fuzz", "only": "ui,fuzz", "ch": "", "browser": "webkit"},
      {"name": "rules,basics", "only": "rules,basics", "ch": ""},
      {"name": "公開サイト（オフライン・リンク・Lighthouse）", "only": "site", "ch": ""},
      {"name": "winrate 第1章", "only": "winrate", "ch": "1"},
      {"name": "winrate 第2章", "only": "winrate", "ch": "2"},
      {"name": "winrate 第3章", "only": "winrate", "ch": "3"},
      {"name": "winrate 第4章", "only": "winrate", "ch": "4"},
      {"name": "winrate 第5章", "only": "winrate", "ch": "5", "full": true},
      {"name": "winrate 第6章", "only": "winrate", "ch": "6", "full": true},
      {"name": "winrate 第7章", "only": "winrate", "ch": "7", "full": true},
      {"name": "winrate 第11章", "only": "winrate", "ch": "11", "full": true},
      {"name": "winrate 第12章", "only": "winrate", "ch": "12", "full": true},
      {"name": "winrate 第13章", "only": "winrate", "ch": "13", "full": true},
      {"name": "winrate 第14章", "only": "winrate", "ch": "14", "full": true},
      {"name": "winrate 第15章", "only": "winrate", "ch": "15", "full": true},
      {"name": "通しで遊ぶ", "only": "playthrough", "ch": "", "nightly": true}
    ]

jobs:
  groups:
    name: 検査の一覧
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
      full: ${{ steps.m.outputs.full }}
      run: ${{ steps.c.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: ゲームか検査が変わったか見る
        id: c
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=true
          if [ -n "$PR" ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
            echo "$files" | grep -qE '^([^/]+\.html$|sw\.js$|style\.css$|licenses/|qa/|\.github/workflows/qa\.yml$)' || run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] || echo "::notice title=検査は飛ばした::ゲームのファイル（*.html・sw.js・style.css・licenses/）も qa/ も qa.yml も変わっていないので、重い検査は回さない"
      - name: どの組にも入っていない検査がないか見る
        id: m
        env:
          FULL: ${{ (inputs.full || startsWith(github.head_ref, 'publish-')) && 'true' || 'false' }}
        run: |
          if ! grep -q -- "'--list'" qa/run_all.js; then
            echo "::error title=qa/ が古い::qa/run_all.js が --list に対応していません。共有フォルダの qa/ を写してください（tools/build_index.py が写します）"
            exit 1
          fi
          missing=$(node qa/run_all.js --list | while read k; do
            jq -e --arg k "$k" 'map(.only | split(",")) | flatten | index($k)' <<<"$QA_GROUPS" >/dev/null || echo "$k"; done)
          if [ -n "$missing" ]; then
            for k in $missing; do echo "::error title=検査の入れ忘れ::$k が qa.yml のどの組にも入っていません"; done
            exit 1
          fi
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c --argjson full "$FULL" 'map(select(.nightly != true) | select(.full != true or $full))' <<<"$QA_GROUPS")" >> "$GITHUB_OUTPUT"

  qa:
    name: ${{ matrix.name }}
    needs: groups
    if: ${{ needs.groups.outputs.run == 'true' }}
    # 実行機の版を固定する（ubuntu-latest は 2026-10-19 から Ubuntu 26 になり、字体が変わって画面の判定がずれるため）
    runs-on: ubuntu-24.04
    # 勝率は1回の上限が「手数×8秒」（80ハンドで約11分）。長い版は1章24回なので、余裕を見て60分
    timeout-minutes: 60
    env:
      QA_BROWSER: ${{ matrix.browser || 'chromium' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.groups.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Playwright と日本語の字体を入れる
        if: ${{ !matrix.nobrowser }}
        run: |
          # 基準（qa/baseline.json）を作った環境と同じ字体にする。字の幅が変わると画面の判定がずれるため
          sudo apt-get update -q && sudo apt-get install -y -q fonts-ipafont-gothic fonts-wqy-zenhei
          cd qa
          # 部品の版は package-lock.json で固定（CIのチェック充実 案7）
          npm ci --no-audit --no-fund
          # 画面の一覧づくり（qa/tools/ci_shots.js）は Chromium を使うので、WebKit の組も両方入れる
          npx playwright install --with-deps chromium ${{ matrix.browser == 'webkit' && 'webkit' || '' }}
      - name: 前の版を用意する（セーブの引き継ぎ・画面の比べ）
        if: ${{ contains(matrix.only, 'save') || contains(matrix.only, 'lines') || contains(matrix.only, 'ui') }}
        env:
          FULL: ${{ needs.groups.outputs.full }}
        run: |
          mkdir -p /tmp/prev
          # セーブの引き継ぎ：公開中の main の index.html（長い版は、さらに前の版のタグ2つ）
          git fetch -q --depth 1 origin main && git show FETCH_HEAD:index.html > /tmp/prev/main.html || true
          list=""
          addv() { v=$(grep -o "APP_VERSION='[^']*'" "$1" | head -1 | sed -E "s/.*'0\.([0-9]+).*/\1/"); [ -n "$v" ] && list="$list${list:+,}$v=$1"; }
          [ -s /tmp/prev/main.html ] && addv /tmp/prev/main.html
          if [ "$FULL" = true ]; then
            for t in $(git ls-remote --tags --refs origin 'v0.*' | sed 's#.*refs/tags/##' | sort -V | tail -3 | head -2); do
              git fetch -q --depth 1 origin "refs/tags/$t:refs/tags/$t" && git show "$t:index.html" > "/tmp/prev/$t.html" && addv "/tmp/prev/$t.html" || true
            done
          fi
          echo "QA_PREV_HTML=$list" >> "$GITHUB_ENV"
          echo "セーブの引き継ぎに使う前の版: $list"
          # 画面の比べ：qa-results にある、いちばん新しい公開版の画面
          if git fetch -q --depth 1 origin qa-results 2>/dev/null; then
            cur=$(grep -o "APP_VERSION='[^']*'" index.html | head -1 | cut -d"'" -f2)
            pv=$(git ls-tree --name-only FETCH_HEAD | sed -n 's/^v//p' | node -e "const c='$cur'.split('.').map(Number),cmp=(a,b)=>a[0]-b[0]||a[1]-b[1]||a[2]-b[2];const v=require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean).map(s=>s.split('.').map(Number)).filter(x=>x.length===3&&cmp(x,c)<0).sort(cmp).pop();console.log(v?v.join('.'):'')")
            if [ -n "$pv" ]; then
              mkdir -p /tmp/prev/ui && git archive FETCH_HEAD "v$pv/ui" | tar -x -C /tmp/prev && echo "QA_PREV_UI=/tmp/prev/v$pv/ui" >> "$GITHUB_ENV"
              echo "画面は v$pv と比べる"
            fi
          fi
      - name: 検査を回す
        # WebKit の組の合否は「検査のまとめ」が決める（画面の新しい問題は ⚠️、止まる・エラーは ❌）。ここで赤くすると自動マージが止まるため
        continue-on-error: ${{ matrix.browser == 'webkit' }}
        env:
          QA_LIGHTHOUSE: ${{ contains(matrix.only, 'site') && '1' || '' }}
        run: node qa/run_all.js index.html --only ${{ matrix.only }} ${{ matrix.ch && format('--ch {0}', matrix.ch) || '' }} --out qa-report ${{ needs.groups.outputs.full == 'true' && '--full' || '' }}
      - name: 画面を見やすくする（JPEG・一覧・前の版との違い）
        if: ${{ always() && contains(matrix.only, 'ui') }}
        run: node qa/tools/ci_shots.js qa-report "$QA_PREV_UI"
      - name: 結果をまとめに出す
        if: always()
        run: test -f qa-report/report.md && cat qa-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: 報告の名前を決める
        if: always()
        id: n
        run: echo "name=qa-report-$(echo '${{ matrix.only }}-${{ matrix.ch }}-${{ matrix.browser }}' | tr ', ' '--')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ steps.n.outputs.name }}
          path: qa-report
          retention-days: 30

  summary:
    # 組ごとの結果を1つにまとめて、ブランチ qa-results に置く。Claude はここだけ読む（qa/ci_result.sh）
    name: 検査のまとめ
    needs: [groups, qa]
    # 新しいコミットで取り消された実行では まとめない（結果の無い組が ❌ に見えるため）
    if: ${{ !cancelled() && needs.groups.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: 対象外の PR
        if: ${{ needs.groups.outputs.run != 'true' }}
        run: echo "検査の対象外（ゲームのファイルも qa/ も変わっていない）" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        if: ${{ needs.groups.outputs.run == 'true' }}
        with:
          pattern: qa-report-*
          path: groups
      - name: まとめる
        if: ${{ needs.groups.outputs.run == 'true' }}
        id: s
        env:
          QA_MATRIX: ${{ needs.groups.outputs.matrix }}
        run: |
          set +e
          node qa/tools/ci_summary.js groups qa-summary > /tmp/summary.log
          echo "code=$?" >> "$GITHUB_OUTPUT"
          grep '^::' /tmp/summary.log || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ needs.groups.outputs.run == 'true' }}
        with:
          name: qa-summary
          path: qa-summary
          retention-days: 90
      - name: ブランチ qa-results に置く
        # よその人のフォークからのプルリクエストは書き込めないので置かない
        if: ${{ needs.groups.outputs.run == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          FULL: ${{ needs.groups.outputs.full }}
        run: |
          ver=$(cat qa-summary/ver.txt)
          if [ -n "$PR" ]; then key="pr/$PR"; else key="branch/$HEAD_REF"; fi
          # 公開の版（publish-… のプルリクエスト、main、長い版の手動実行）は v<版>/ にも置く（次の版の画面の比べに使う）
          vkey=""; case "$HEAD_REF" in publish-*|main) vkey="v$ver";; esac
          [ "$FULL" = true ] && [ -z "$PR" ] && vkey="v$ver"
          printf 'branch: %s\nsha: %s\nrun: %s/%s/actions/runs/%s\nfull: %s\nat: %s\n' "$HEAD_REF" "${{ github.event.pull_request.head.sha || github.sha }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$FULL" "$(date -u +%FT%TZ)" > qa-summary/run.txt
          bash qa/tools/publish_results.sh qa-summary "$key" "$vkey"
      - name: 合否
        run: exit ${{ steps.s.outputs.code || 0 }}
