# ゲームが変わるたびに検査（qa/）を回す。テスト公開はプルリクエストで出して、✅ を見てからマージする
name: QA

on:
  pull_request:
    paths: ['index.html', 'qa/**', '.github/workflows/qa.yml']
  push:
    branches: [main]
    paths: ['index.html', 'qa/**', '.github/workflows/qa.yml']
  workflow_dispatch:
    inputs:
      full:
        description: '長い版で回す'
        type: boolean
        default: false

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright を入れる
        run: |
          cd qa
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: 検査を回す
        run: node qa/run_all.js index.html --out qa-report ${{ inputs.full && '--full' || '' }}
      - name: 報告をまとめに出す
        if: always()
        run: test -f qa-report/report.md && cat qa-report/report.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report
          path: qa-report
          retention-days: 30
