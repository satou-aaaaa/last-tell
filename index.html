@keyframes bokeh{to{transform:translate(2%,-3%) scale(1.05)}}
@media (prefers-reduced-motion:reduce){body::before{animation:none}}
.wrap{position:relative;z-index:1}
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:grid;gap:14px}
h1,h2,h3{text-wrap:balance}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
button{font:inherit;font-weight:900;letter-spacing:.06em;border:0;background:var(--panel2);color:var(--ink);padding:10px 22px;cursor:pointer;min-height:44px;
  clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%);transition:background .12s,transform .12s}
button:hover:not(:disabled){background:#2a2e40}
button:active:not(:disabled){transform:translateY(1px)}
button:focus-visible,input:focus-visible,.box:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--crimson);color:#fff}
button.primary:hover:not(:disabled){background:#ec3550}
button.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
button.danger{background:#262833}
button.small{padding:5px 14px;min-height:36px;font-size:.82rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.av{display:block;width:100%;height:100%}
.stars{font-family:var(--num);color:var(--gold);letter-spacing:.05em;font-size:.75rem}

/* ---------- タイトル ---------- */
#title{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);gap:20px;align-items:center;padding-block:30px 10px}
.logo{display:grid;gap:16px}
.logo .eyebrow{font-family:var(--num);color:var(--crimson);letter-spacing:.35em;font-size:.85rem}
.logo h1{font-family:var(--display);font-weight:800;font-size:clamp(2.8rem,10vw,4.8rem);margin:0;line-height:1.08;color:var(--ink);letter-spacing:.04em}
.logo h1 span{color:var(--gold)}
.logo .subtitle{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.5em;color:var(--gold);margin:6px 0 2px}
.logo p{margin:0;line-height:1.9;max-width:30em;color:var(--muted);border-left:3px solid var(--crimson);padding-left:12px}
.hero{position:relative;aspect-ratio:1;max-width:100%;background:
  linear-gradient(115deg,transparent 38%,var(--crimson) 38% 56%,transparent 56%),radial-gradient(circle at 55% 45%,#2b2f40,var(--bg) 70%);
  overflow:hidden}
.hero .tagname{position:absolute;left:0;bottom:12px;background:var(--gold);color:#111;padding:3px 16px 3px 12px;font-weight:900;font-size:.85rem;
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
@media (max-width:620px){#title{grid-template-columns:1fr}.hero{width:70%;justify-self:center}}

/* ---------- 章選択 ---------- */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.top h2{font-family:var(--display);font-weight:800;margin:0;font-size:1.6rem}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 16px;align-items:center;
  padding:14px 18px;background:var(--panel);border-left:4px solid var(--crimson)}
.ch .no{font-family:var(--num);font-weight:700;font-size:2rem;color:var(--gold);width:1.6em;text-align:center;grid-row:span 2;line-height:1}
.ch .t{font-weight:900;font-size:1.05rem;min-width:0}
.ch .v{color:var(--muted);font-size:.85rem;min-width:0}
.ch .act{grid-row:span 2}
.ch.locked{opacity:.4;border-left-color:var(--line)}
.ch .done{background:var(--gold);color:#111;font-size:.7rem;padding:1px 8px;margin-left:8px;vertical-align:2px;font-weight:900}
.hint{color:var(--muted);font-size:.88rem}

/* ---------- 会話シーン ---------- */
#scene{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;padding:16px;position:relative;overflow:hidden;
  min-height:min(82vh,720px);align-content:end;background:linear-gradient(180deg,color-mix(in srgb,var(--venue) 55%,var(--bg)),var(--bg) 80%)}
.venue{position:absolute;top:16px;left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.venue .vchip{background:var(--crimson);color:#fff;padding:3px 14px 3px 10px;font-weight:900;font-size:.8rem;clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.venue .vn{font-family:var(--display);font-weight:800;font-size:1.05rem;letter-spacing:.06em}
.stage{height:min(48vh,360px);min-width:0;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;position:relative}
.stage::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .25s}
.stage.cool::before{opacity:1;background:linear-gradient(110deg,transparent 30%,var(--crimson) 30% 46%,transparent 46%)}
.stage.cute::before{opacity:1;background:radial-gradient(circle at 30% 40%,rgba(255,184,207,.35) 0 16%,transparent 17%),
  radial-gradient(circle at 72% 30%,rgba(255,225,140,.3) 0 12%,transparent 13%),radial-gradient(circle at 60% 70%,rgba(160,200,255,.28) 0 14%,transparent 15%)}
.portrait{position:relative;height:100%;aspect-ratio:1;max-width:100%;animation:slide .3s ease-out}
.stage.cute .portrait{animation:bounce .35s ease-out}
@keyframes slide{from{transform:translateX(-18px);opacity:.2}to{transform:none;opacity:1}}
@keyframes bounce{0%{transform:translateY(14px) scale(.96)}60%{transform:translateY(-4px)}100%{transform:none}}
.box{position:relative;background:rgba(14,15,20,.94);box-shadow:inset 0 0 0 1px var(--line);padding:24px 18px 16px;cursor:pointer;min-height:120px;
  clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.nametag{position:absolute;top:0;left:0;display:flex;gap:10px;align-items:baseline;background:var(--gold);color:#111;
  padding:2px 22px 2px 14px;font-weight:900;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.nametag.cute{background:var(--cute)}
.nametag .stars{color:#111;font-size:.7rem}
.line{line-height:1.95;font-size:1.06rem;font-weight:700;min-width:0}
.line.narr{color:var(--muted);font-weight:500}
.lesson{display:grid;gap:6px}
.lesson .lt{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--gold)}
.lesson p{margin:0;line-height:1.9;max-width:38em}
.lesson-tag{position:absolute;top:0;left:0;background:var(--crimson);color:#fff;padding:2px 22px 2px 14px;font-weight:900;font-size:.85rem;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.scene-btns{justify-content:flex-end}
@media (prefers-reduced-motion:reduce){.portrait,.stage.cute .portrait{animation:none}button{transition:none}}

/* ---------- 卓 ---------- */
header.g{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px 16px}
header.g h1{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0;letter-spacing:.04em}
.goal{font-weight:900;font-size:.88rem;background:var(--crimson);color:#fff;padding:5px 18px 5px 12px;font-variant-numeric:tabular-nums;
  clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.meta{color:var(--muted);font-size:.8rem;font-family:var(--num);letter-spacing:.06em;font-variant-numeric:tabular-nums}
.table{
  background:radial-gradient(ellipse at 50% 42%,var(--felt-hi),var(--felt) 70%);
  border:6px solid #1b1d26;box-shadow:inset 0 0 0 1px var(--gold),0 0 0 1px var(--line),0 18px 40px rgba(0,0,0,.6);
  border-radius:140px;padding:22px 28px;
  display:grid;grid-template-columns:1fr minmax(0,2.2fr) 1fr;
  grid-template-areas:". p2 ." "p1 board p3" ". p0 .";gap:14px 12px;align-items:center;justify-items:center;
}
.board{grid-area:board;display:grid;gap:8px;justify-items:center;text-align:center;min-width:0}
.seat{display:grid;gap:4px;justify-items:center;padding:8px 10px;min-width:0;background:rgba(13,14,19,.82);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:background .2s}
.seat.turn{background:rgba(226,182,91,.22);box-shadow:inset 0 0 0 2px var(--gold)}
.seat.out{opacity:.35}
.seat .ava{width:46px;height:46px;overflow:hidden;background:var(--panel2);clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.seat .ava.cute{background:#3b2f45}
.seat .ava.cool{background:linear-gradient(115deg,var(--panel2) 40%,var(--crimson) 40% 58%,var(--panel2) 58%)}
.seat .name{font-weight:900;display:flex;gap:6px;align-items:center}
.seat .style{font-size:.7rem;color:var(--muted)}
.seat .stack-n{font-family:var(--num);font-weight:500;font-size:.95rem;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.dealer{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#111;font-size:.68rem;font-weight:900}
.hand{display:flex;gap:4px}
.hand.folded{opacity:.3;filter:grayscale(1)}
.tag{font-size:.75rem;padding:0 8px;background:#262833;color:var(--muted);min-height:1.3em}
.tag.bet{color:#fff;background:var(--crimson)}
.tag.win{background:var(--gold);color:#111;font-weight:900}
.handname{font-family:var(--display);font-weight:800;font-size:.85rem;color:var(--gold);min-height:1.1em}
.card{width:var(--cw);aspect-ratio:5/7;max-width:100%;border-radius:5px;background:#f6f3ec;color:#16171c;
  display:grid;place-content:center;justify-items:center;line-height:1;box-shadow:0 3px 8px rgba(0,0,0,.5);
  font-family:var(--num);font-weight:700;animation:deal .22s ease-out}
.card .r{font-size:calc(var(--cw)*.42)}.card .s{font-size:calc(var(--cw)*.4)}
.card.red{color:var(--cardred)}
.card.back{background:#1b1d26;background-image:linear-gradient(135deg,transparent 45%,var(--crimson) 45% 55%,transparent 55%),
  repeating-linear-gradient(45deg,rgba(226,182,91,.25) 0 1px,transparent 1px 6px);box-shadow:inset 0 0 0 2px var(--gold),0 3px 8px rgba(0,0,0,.5)}
.card.slot{background:transparent;box-shadow:inset 0 0 0 1px rgba(226,182,91,.35);animation:none}
@keyframes deal{from{transform:translateX(-10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.seat{transition:none}}
.street{font-family:var(--num);font-size:.95rem;letter-spacing:.3em;color:var(--gold)}
.cards5{display:flex;gap:6px;flex-wrap:nowrap}
.pot{font-family:var(--num);font-variant-numeric:tabular-nums;font-size:1.05rem;letter-spacing:.06em}
.msg{min-height:1.4em;font-size:.92rem;font-weight:700}
.panel{background:var(--panel);padding:14px;display:grid;gap:12px;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,0 100%)}
.sensei{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.sensei .ava{width:50px;height:50px;overflow:hidden;background:linear-gradient(115deg,var(--panel2) 40%,var(--crimson) 40% 58%,var(--panel2) 58%);

/* かわいい：頭が大きいちびキャラ。表情は大きく */
function cuteAvatar(name,c,mood){
  const L='#2b2d4a',SK='#ffe2cc',sw=`stroke="${L}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"`;
  let back='',eyes='',ex='',mouth='',fx='';

  if(c.style==='bob')back=`<path d="M20 50 Q18 16 50 14 Q82 16 80 50 L81 70 Q70 74 64 68 L36 68 Q30 74 19 70Z" fill="${c.hair}" ${sw}/>`;
  if(c.style==='bun')back=`<circle cx="50" cy="10" r="9" fill="${c.hair}" ${sw}/>`;
  const fringe={
    short:`<path d="M21 48 Q19 13 50 12 Q81 13 79 48 Q72 30 60 31 Q55 24 46 31 Q32 29 21 48Z" fill="${c.hair}" ${sw}/>`,
    long:`<path d="M21 50 Q20 14 50 13 Q80 14 79 50 Q68 32 50 28 Q38 38 21 50Z" fill="${c.hair}" ${sw}/>`,
    bob:`<path d="M21 50 Q20 14 50 13 Q80 14 79 50 Q64 38 48 30 Q36 40 21 50Z" fill="${c.hair}" ${sw}/>`,
    bun:`<path d="M21 46 Q21 15 50 15 Q79 15 79 46 Q66 28 50 27 Q34 28 21 46Z" fill="${c.hair}" ${sw}/>`,
    buzz:`<path d="M22 40 Q24 15 50 15 Q76 15 78 40 Q50 28 22 40Z" fill="${c.hair}" ${sw}/>`,
    spiky:`<path d="M20 48 L17 26 L30 30 L32 12 L44 25 L54 8 L59 25 L72 12 L70 30 L83 27 L79 48 Q64 32 50 34 Q36 32 20 48Z" fill="${c.hair}" ${sw}/>`,
  }[c.style];
  const iris=c.iris||L;
  const bigEyes=(dx,dy)=>`<g class="eyes"><ellipse cx="39" cy="54" rx="5.6" ry="7.4" fill="#fff" stroke="${L}" stroke-width="1.8"/><ellipse cx="61" cy="54" rx="5.6" ry="7.4" fill="#fff" stroke="${L}" stroke-width="1.8"/>
    <ellipse cx="${39+dx}" cy="${54+dy}" rx="4.6" ry="6.2" fill="${iris}"/><ellipse cx="${61+dx}" cy="${54+dy}" rx="4.6" ry="6.2" fill="${iris}"/>
    <circle cx="${41+dx}" cy="${51+dy}" r="2.2" fill="#fff"/><circle cx="${63+dx}" cy="${51+dy}" r="2.2" fill="#fff"/></g>`;
  const blushO=c.blush||mood==='win'?.95:.6;
  if(mood==='think'){eyes=bigEyes(1.6,-2);mouth=`<ellipse cx="52" cy="66" rx="2.6" ry="2" fill="#ff7a8a" ${sw}/>`;
    fx=`<text x="80" y="22" font-size="16" font-weight="900" fill="#e2b65b" stroke="${L}" stroke-width=".8">?</text>`}
  else if(mood==='confident'){eyes=bigEyes(0,0)+`<path d="M31 41 L46 46 M69 41 L54 46" ${sw} stroke-width="3"/>`;
    mouth=`<path d="M42 63 Q50 72 58 63Z" fill="#ff7a8a" ${sw}/>`;fx=`<path d="M82 30 l6 -6 M84 38 l8 -2 M80 22 l2 -8" stroke="#ff5f86" stroke-width="2.4" stroke-linecap="round"/>`}
  else if(mood==='worried'){eyes=bigEyes(0,1)+`<path d="M31 46 L45 41 M69 46 L55 41" ${sw}/>`;
    mouth=`<path d="M43 67 q3.5 -4 7 0 q3.5 4 7 0" fill="none" ${sw}/>`;fx=SWEAT(78,30)}
  else if(mood==='win'){eyes=`<g class="eyes"><path d="M32 56 Q39 46 46 56 M54 56 Q61 46 68 56" fill="none" ${sw} stroke-width="3"/></g>`;
    mouth=`<path d="M41 62 Q50 75 59 62Z" fill="#ff7a8a" ${sw}/>`;
    fx=`<path d="M12 22 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2Z M86 14 l1.6 4.4 l4.4 1.6 l-4.4 1.6 l-1.6 4.4 l-1.6 -4.4 l-4.4 -1.6 l4.4 -1.6Z" fill="#ffd34d" stroke="${L}" stroke-width="1"/>`}
  else if(mood==='lose'){eyes=`<g class="eyes"><path d="M33 52 Q39 58 45 52 M55 52 Q61 58 67 52" fill="none" ${sw} stroke-width="2.6"/></g>`;

    fx=`<path d="M37 58 q-3 8 0 12 q3 -4 0 -12Z M63 58 q-3 8 0 12 q3 -4 0 -12Z" fill="#9fd8ff" stroke="${L}" stroke-width="1"/>`}
  else{
    if(c.eyes==='grin')eyes=`<g class="eyes"><path d="M34 54 Q40 46 46 54 M54 54 Q60 46 66 54" fill="none" ${sw}/></g>`;
    else eyes=bigEyes(0,0);
    mouth={smile:`<path d="M46 66 Q50 69 54 66" fill="none" ${sw}/>`,open:`<path d="M44 64 Q50 73 56 64Z" fill="#ff7a8a" ${sw}/>`}[c.mouth];

  // 陰影：同じ形に光と影のグラデーションを重ねる
  const shade=(svg,g)=>svg.replace(/fill="[^"]*"/,`fill="url(#${g})"`).replace(/stroke="[^"]*"|stroke-width="[^"]*"/g,'');
  return`<svg class="av" viewBox="0 0 100 100" role="img" aria-label="${esc(name)}">${back}${shade(back,'shadeHead')}${body}${shade(body,'shadeBody')}

}

const tellsOn=p=>CFG.tells||(!!CFG.ch&&rankOf(p.name)<=2);
function showTell(i,d){
  const p=S.players[i];p.tell=null;
  const T=TELLS[p.name];if(!tellsOn(p)||!T)return;
  const rev=!!T.reverse&&(S.handNo>=10||p.chips<p.start/2);
  let shown=null;
  for(const cat of ['strong','bluff']){
    const t=T[cat];let prob=d.state===cat?t.rate:t.false;
    if(S.needle===S.street&&t.cue==='talk')prob=Math.min(.95,prob+.15);
    if(Math.random()<prob){shown=cat;break}
  }
  if(!shown)return;
  const cueCat=rev?(shown==='strong'?'bluff':'strong'):shown;
  S.tellSeq=(S.tellSeq||0)+1;
  p.tell={cue:T[cueCat].cue,meaning:cueCat,truth:d.state,street:S.street,seq:S.tellSeq,rev};
  p.tellLog.push(p.tell);
  if(rev&&!S.revSaid){S.revSaid=S.handNo+':'+S.street}
  if(reducedMotion())log(`${p.name}：${CUE_LABEL[p.tell.cue]}`);
}

/* ---------- 山札・役判定 ---------- */
function fullDeck(){const d=[];for(let s=0;s<4;s++)for(let r=2;r<=14;r++)d.push({r,s});return d}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function eval5(cs){
  const rs=cs.map(c=>c.r).sort((a,b)=>b-a);
  const flush=cs.every(c=>c.s===cs[0].s);
  const uniq=[...new Set(rs)];
  let straightHigh=0;
  if(uniq.length===5){
    if(rs[0]-rs[4]===4)straightHigh=rs[0];
    else if(rs[0]===14&&rs[1]===5)straightHigh=5;
  }
  const cnt={};rs.forEach(r=>cnt[r]=(cnt[r]||0)+1);
  const groups=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const kick=groups.map(g=>g[0]);
  if(straightHigh&&flush)return[8,straightHigh];
  if(groups[0][1]===4)return[7,...kick];
  if(groups[0][1]===3&&groups[1][1]===2)return[6,...kick];
  if(flush)return[5,...rs];
  if(straightHigh)return[4,straightHigh];
  if(groups[0][1]===3)return[3,...kick];
  if(groups[0][1]===2&&groups[1][1]===2)return[2,...kick];
  if(groups[0][1]===2)return[1,...kick];
  return[0,...rs];
}
function cmp(a,b){for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0}
/* 5〜7枚から最強の5枚 */
function bestN(cs){
  let best=null;const n=cs.length,idx=[];
  (function rec(st,k){
    if(k===5){const s=eval5(idx.map(i=>cs[i]));if(!best||cmp(s,best)>0)best=s;return}
    for(let i=st;i<=n-(5-k);i++){idx.push(i);rec(i+1,k+1);idx.pop()}
  })(0,0);
  return best;
}
/* 5枚未満でも使える「ペア系の役の段階」 */
function groupCat(cs){
  if(cs.length===5)return eval5(cs)[0];
  const cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const v=Object.values(cnt).sort((a,b)=>b-a);
  if(v[0]===4)return 7;if(v[0]===3)return 3;if(v[0]===2&&v[1]===2)return 2;if(v[0]===2)return 1;return 0;
}
/* 自分の2枚が役に絡んでいない＝実質「何もない」 */
function isWeak(hand,board){
  if(board.length<3)return false;
  const mine=bestN(hand.concat(board))[0];
  return mine===0||mine<=groupCat(board);
}
function handName(s){if(s[0]===8&&s[1]===14)return'ロイヤルフラッシュ';return HAND_JP[s[0]]}
function preTier(h){
  const [a,b]=[h[0].r,h[1].r].sort((x,y)=>y-x),suited=h[0].s===h[1].s;
  if(a===b)return a>=7?2:1;
  if(a===14&&b>=11)return 2;
  if(a===13&&b===12)return 2;
  if(a===14&&suited)return 1;
  if(a>=10&&b>=10)return 1;
  if(suited&&a-b<=2&&b>=5)return 1;
  if(a===14&&b>=9)return 1;
  return 0;
}

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+Math.min(.6,dur/3));g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  }

    const b=c.createBuffer(1,Math.floor(c.sampleRate*.04),c.sampleRate),d=b.getChannelData(0);for(let k=0;k<d.length;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/d.length,3);
    const s=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=4;g.gain.value=vol;

    heart(){if(!SETTINGS.sound||paused)return;tone(58,.18,.3,'sine');tone(52,.2,.22,'sine',.16)},

function calcEq(){
  const live=S.players.filter(inHand);if(live.length<2)return;
  const need=5-S.board.length,deck=S.deck.slice(),win=live.map(()=>0);let n=0;
  const score=b=>{const sc=live.map(p=>bestN(p.hand.concat(b)));let top=sc[0];sc.forEach(x=>{if(cmp(x,top)>0)top=x});
    const ws=sc.map((x,k)=>cmp(x,top)===0?k:-1).filter(k=>k>=0);ws.forEach(k=>win[k]+=1/ws.length);n++};
  if(need===0)score(S.board);
  else if(need===1)deck.forEach(c=>score(S.board.concat([c])));
  else if(need===2){for(let a=0;a<deck.length;a++)for(let b=a+1;b<deck.length;b++)score(S.board.concat([deck[a],deck[b]]))}
  else for(let t=0;t<600;t++){const d=deck.slice(),add=[];for(let k=0;k<need;k++)add.push(d.splice(Math.floor(Math.random()*d.length),1)[0]);score(S.board.concat(add))}
  live.forEach((p,k)=>{const v=Math.round(win[k]/n*100);p.eqDir=p.eq==null?'':v>p.eq?' up':v<p.eq?' down':'';p.eq=v});
}

const Clock=(()=>{
  let iv=0,key='',left=0,last=0,beat=0;
  const limit=()=>CFG.ch&&CFG.ch.no<=3?45:30;
  function stop(){clearInterval(iv);iv=0;key='';$('clock').hidden=true;$('clock').classList.remove('low')}
  function start(k){
    if(!SETTINGS.clock||key===k)return;stop();key=k;left=limit()*1000;last=Date.now();beat=0;
    const s0=S,h0=S.handNo;$('clock').hidden=false;draw();
    iv=setInterval(()=>{
      if(S!==s0||S.handNo!==h0||S.handOver||S.toAct!==0||$('game').hidden)return stop();
      const now=Date.now(),dt=now-last;last=now;if(document.hidden)return; // 裏に回っている間は減らさない
      left-=dt;beat-=dt;
      if(left<=15000&&beat<=0){Sound.heart();if(left<=6000&&navigator.vibrate)try{navigator.vibrate(25)}catch(e){};beat=left<=6000?520:950}
      draw();
      if(left<=0)timeUp();
    },100);
  }
  function draw(){
    const t=Math.max(0,left),c=$('clock');
    c.querySelector('i').style.transform=`scaleX(${(t/(limit()*1000)).toFixed(3)})`;
    c.querySelector('span').textContent=t>0?`持ち時間 ${Math.ceil(t/1000)}秒`:'時間です';
    c.classList.toggle('low',t<=6000);
  }
  function timeUp(){

    if(CFG.ch&&CFG.ch.no<=3){S.msg='ジン「時間だ。そろそろ決めろ」';$('msg').textContent=S.msg;return}

  }
  return{start,stop};
})();

  const cont=S.players.filter(inHand),opp=cont.filter(p=>!p.human);
  if(!opp.length||S.runout)return showdown();
  S.reveal=true;S.toAct=-1;
  // 最後に攻めた人から開く。いなければボタンの左から
  const seat=p=>(S.players.indexOf(p)-S.dealer-1+N())%N();
  opp.sort((a,b)=>seat(a)-seat(b));
  const ag=S.players[S.aggr];if(ag&&opp.includes(ag)){opp.splice(opp.indexOf(ag),1);opp.unshift(ag)}
  // スロウロール：勝っているマナーの悪い相手が、最後にわざとゆっくり開く
  const sc=cont.map(p=>bestN(p.hand.concat(S.board)));let top=sc[0];sc.forEach(x=>{if(cmp(x,top)>0)top=x});
  const slow=!S.players[0].folded&&cont.includes(S.players[0])&&cmp(sc[cont.indexOf(S.players[0])],top)<0?
    opp.find(p=>{const m=mannerOf(p);return m&&cmp(sc[cont.indexOf(p)],top)===0&&Math.random()<m.slowroll}):null;
  if(slow){opp.splice(opp.indexOf(slow),1);opp.push(slow)}
  dealerSay('ショーダウン');render();
  let t=600*SPEED();
  opp.forEach((p,k)=>{
    const lastOne=k===opp.length-1;
    if(p===slow){
      setTimeout(()=>{if(!ok())return;p.say={seq:(S.saySeq=(S.saySeq||0)+1),line:lineFor(p.name,'slowroll'),talk:true};S.meSmug=true;render()},t);
      t+=(reducedMotion()||SETTINGS.speed==='fast'?1000:2300);
      setTimeout(()=>{if(!ok())return;S.meSmug=false;p.showN=1;p.slow=true;Sound.sfx('card');render()},t);t+=1500*SPEED();
      setTimeout(()=>{if(!ok())return;p.showN=2;Sound.sfx('card');render()},t);t+=1300*SPEED();
      setTimeout(()=>{if(!ok())return;S.slowrolled=S.players.indexOf(p)},t-10);
      return;
    }
    setTimeout(()=>{if(!ok())return;p.showN=1;Sound.sfx('card');render()},t);t+=(lastOne?1300:800)*SPEED();
    setTimeout(()=>{if(!ok())return;p.showN=2;p.slow=lastOne;Sound.sfx('card');render()},t);t+=(lastOne?1300:700)*SPEED();
  });
  setTimeout(()=>{if(!ok())return;S.reveal=false;showdown()},t);
}

function roundComplete(){
  const ca=S.players.filter(canAct);
  if(ca.length===0)return true;
  if(ca.length===1&&ca[0].bet>=S.currentBet)return true;
  return !ca.some(needs);
}
function proceed(){
  const live=S.players.filter(inHand);
  if(live.length===1)return winUncontested(live[0]);
  const hold=S.hold||0;S.hold=0;
  const s0=S,h0=S.handNo; // 章を出入りしたあとに古いタイマーが動かないように
  if(roundComplete()){
    const next={preflop:'flop',flop:'turn',turn:'river'}[S.street];
    // 1. オールインで勝負がついたら、全員の手を開き、残りの場札を1枚ずつ溜めてめくる
    if(next&&!S.runout&&live.filter(p=>!p.allIn).length<=1){
      S.runout=true;live.forEach(p=>{p.show=true});calcEq();
      log('オールイン：手札を開いて、残りのカードを配ります');dealerSay('ハンドをオープン');
    }
    render();
    const go=()=>{if(S===s0&&S.handNo===h0)nextStreet()};
    if(S.runout&&next&&next!=='flop')
      return setTimeout(()=>{if(S!==s0||S.handNo!==h0)return;S.tease=true;render();Sound.heart();
        setTimeout(go,(next==='river'?1700:1100)*SPEED())},1000*SPEED()+hold);
    return setTimeout(go,(S.runout?1300:800)*SPEED()+hold);
  }
  render();
  const i=S.toAct,p=S.players[i];
  if(p.human&&S.myTurnKey!==S.handNo+S.street+S.currentBet){S.myTurnKey=S.handNo+S.street+S.currentBet;S.myTurnAt=Date.now()}
  if(p.human&&bigSpotForMe())Clock.start(S.myTurnKey);
  if(!p.human){
    const d=cpuDecide(i);p.lastState=d.state;showTell(i,d);
    const fast=p.tell&&p.tell.cue==='fast';
    // 考えている間に、ときどきひとこと（速攻のクセのときは黙ってすぐ賭ける）
    const talk=!fast&&!(p.tell&&p.tell.cue==='talk')&&Math.random()<.4;
    if(talk){p.say={seq:(S.saySeq=(S.saySeq||0)+1),line:thinkLine(p,S.currentBet-p.bet),talk:true}}
    // 2. 大きな賭けの前は、黙り込んでこちらをじっと見る。BGMが止まり、チップの音だけになる
    const toCall=S.currentBet-p.bet,pot=potTotal();
    const big=!fast&&S.stareKey!==S.handNo+S.street+i&&(d.type==='raise'&&(d.to>=p.bet+p.chips||d.to-p.bet>=Math.max(BB()*6,pot*.6))||d.type!=='fold'&&toCall>=Math.max(BB()*6,p.chips*.4));
    if(big){S.stare=i;S.stareKey=S.handNo+S.street+i;p.say=null;$('table').classList.add('hush');Sound.hush(true)}
    render();
    // アングルショット：1ハンドに1回まで。ディーラーが止めるので、得はさせない
    const mn=mannerOf(p);let angle='';
    if(mn&&!big&&S.angleHand!==S.handNo&&d.type==='raise'&&Math.random()<mn.angleRate){
      const tc=S.currentBet-p.bet;
      if(tc===0&&d.rel&&mn.angles.includes('faketap'))angle='faketap';
      else if(tc>0&&mn.angles.includes('onechip'))angle='onechip';
      if(angle){S.angleHand=S.handNo;d.type='call';delete d.to}
    }
    const wait=(fast?200:650+Math.random()*600+(talk&&!big?700:0)+(big?1600:0))*SPEED()+hold;
    if(angle){setTimeout(()=>{if(S===s0&&S.handNo===h0&&!S.handOver&&S.toAct===i)angleCall(i,angle)},wait);
      setTimeout(()=>{if(S===s0&&S.handNo===h0&&!S.handOver&&S.toAct===i){S.angleActing=i;act(i,'call');angleRuling(i,angle)}},wait+1300*SPEED());return}
    setTimeout(()=>{if(S===s0&&S.handNo===h0&&!S.handOver&&S.toAct===i)act(i,d.type,d.to)},wait);
  }
}
function act(i,type,to){
  const p=S.players[i];
  if(S.handOver||i!==S.toAct)return;
  const toCall=S.currentBet-p.bet;
  if(p.human&&type==='fold'){if(S.myTurnAt&&Date.now()-S.myTurnAt>=15000)grantTitle('tankfold');if(S.street==='preflop')S.myPreFold=true}
  if(type==='raise'&&p.acted)type='call'; // 足りないオールインのあとは、レイズできない
  if(p.human)Clock.stop();
  if(S.stare===i){S.stare=-1;$('table').classList.remove('hush');Sound.hush(false)}
  if(type==='fold'){p.folded=true;p.lastAct='フォールド';p.lastType='fold';log(`${p.name}：フォールド`)}
  else if(type==='call'){
    if(toCall<=0){p.lastAct='チェック';p.lastType='call';log(`${p.name}：チェック`)}
    else{const a=post(p,toCall);p.lastAct=p.allIn?`オールイン ${fmt(p.bet)}`:`コール ${fmt(a)}`;p.lastType='call';log(`${p.name}：コール ${fmt(a)}${p.allIn?'（オールイン）':''}`)}
  }else{
    to=Math.min(to,p.bet+p.chips);
    const prev=S.currentBet;
    post(p,to-p.bet);
    if(p.bet>prev){
      const inc=p.bet-prev;
      const full=inc>=S.minRaise;if(full)S.minRaise=inc;
      S.currentBet=p.bet;S.raises++;S.aggr=i;S.lastCalled=-1;
      if(p.human&&S.street!=='preflop')S.myPostAggro=true;
      // 足りないオールインは、すでに話した人にレイズの権利を戻さない（コールかフォールドだけ）
      if(full)S.players.forEach(q=>{if(q!==p)q.acted=false});
      p.lastAct=p.allIn?`オールイン ${fmt(p.bet)}`:`${prev===0?'ベット':'レイズ'} ${fmt(p.bet)}`;p.lastType='raise';log(`${p.name}：${prev===0?'ベット':'レイズ'} ${fmt(p.bet)}${p.allIn?'（オールイン）':''}`);
      dealerSay(p.allIn?'オールイン':`${prev===0?'ベット':'レイズ'}、${fmt(p.bet)}`);
    }else{p.lastAct='コール';p.lastType='call';log(`${p.name}：コール${p.allIn?'（オールイン）':''}`)}
  }
  if(p.human&&type==='call'&&toCall>0)S.lastCalled=S.aggr;
  p.acted=true;
  if(type!=='fold'&&(type==='raise'||toCall>0))Sound.sfx('chip');
  afterAct(i,type,toCall);
  S.toAct=nextIdx(i,needs);
  proceed();
}
/* 行動のあと：吹き出し・動き・カットイン */
function afterAct(i,type,toCall){
  const p=S.players[i];
  let kind=type==='fold'?'fold':type==='call'?(toCall<=0?'check':'call'):'raise';
  if(p.allIn&&type!=='fold')kind='allin';
  p.actSeq=(p.actSeq||0)+1;p.actKind=kind;
  if(kind==='allin')pushChips(i);
  if(p.human)return;
  let line='';
  const st=p.lastState==='strong'?'_strong':p.lastState==='bluff'?'_bluff':'';
  if(p.tell&&p.tell.cue==='talk'&&p.tell.street===S.street&&kind!=='fold')line=lineFor(p.name,'talk');
  else if(S.needle===S.street&&!p.answered&&Math.random()<.7){line=lineFor(p.name,'needled');p.answered=true}
  else if(Math.random()<talkRate(p.name)||kind==='allin')line=lineFor(p.name,(kind==='raise'||kind==='allin')?kind+st:kind);
  if(S.angleHand===S.handNo&&S.angleActing===i){S.angleActing=-1;line=''}
  p.say={seq:(S.saySeq=(S.saySeq||0)+1),act:p.lastAct,line};
  const boss=rankOf(p.name)>=3||(CFG.ch&&i===1);
  if(kind==='allin'&&boss)cutIn(p.name,lineFor(p.name,'allin'));
}
function cutIn(name,line){
  const c=$('cutin');
  c.querySelector('.cav').innerHTML=avatar(name,'confident');
  c.querySelector('.ctext').innerHTML=`<b>${esc(name)}</b><span>オールイン</span><p>「${esc(line)}」</p>`;
  c.hidden=false;c.classList.remove('go');void c.offsetWidth;c.classList.add('go');
  S.hold=1700;
  setTimeout(()=>{c.hidden=true},1800);
}

function nextStreet(){
  if(S.handOver)return;
  gatherBets();
  S.players.forEach(p=>{p.bet=0;p.acted=false;if(!p.folded&&!p.allIn)p.lastAct=''});
  S.currentBet=0;S.minRaise=BB();S.raises=0;S.tease=false;
  if(S.street==='river')return revealThenShowdown();
  const next={preflop:'flop',flop:'turn',turn:'river'}[S.street];
  const n=next==='flop'?3:1;
  S.deck.pop();
  const dealt=[];for(let k=0;k<n;k++){const c=S.deck.pop();S.board.push(c);dealt.push(c)}
  S.street=next;
  log(`${STREET_JP[next]}：${dealt.map(cardStr).join(' ')}`);
  dealerSay(STREET_JP[next]);Sound.sfx('card');
  if(S.runout)calcEq();
  S.toAct=nextIdx(S.dealer,needs);
  proceed();
}
function winUncontested(p){
  const pr=potRect();
  const pot=potTotal();p.chips+=pot;p.won=pot;
  S.handOver=true;S.toAct=-1;
  S.msg=`${p.name}の勝ち（+${fmt(pot)}）`;
  log(`${p.name}がポット ${fmt(pot)} を獲得`);
  if(p.human&&S.street==='preflop'&&S.aggr===0){S.steals++;if(CFG.goal.type==='steal')S.msg=`ブラインドを盗んだ！（+${fmt(pot)}）`}
  if(p.human&&S.street!=='preflop'&&S.myPostAggro&&isWeak(p.hand,S.board)){S.bluffs++;if(CFG.goal.type==='bluff')S.msg=`ブラフ成功！（+${fmt(pot)}）`}
  payHouse72();
  if(mannerOf(p)&&mannerOf(p).gloat&&S.players[0].total>=BB()*3&&Math.random()<.35)taunt(p,'gloat');
  endHand();
  potFly(pr,pot);potCall();
}
function showdown(){
  const pr=potRect(),potAmt=potTotal();
  S.street='showdown';
  const cont=S.players.filter(inHand);
  cont.forEach(p=>{p.show=true;p.score=bestN(p.hand.concat(S.board));p.hname=handName(p.score)});
  const contrib=S.players.filter(p=>p.total>0);
  const levels=[...new Set(contrib.map(p=>p.total))].sort((a,b)=>a-b);
  let prev=0;
  for(const L of levels){
    let amt=0;contrib.forEach(p=>{amt+=Math.min(p.total,L)-Math.min(p.total,prev)});
    let elig=cont.filter(p=>p.total>=L);
    if(!elig.length)elig=cont;
    const top=elig.reduce((a,b)=>cmp(a.score,b.score)>=0?a:b);
    const seat=p=>(S.players.indexOf(p)-S.dealer-1+N())%N();
    const winners=elig.filter(p=>cmp(p.score,top.score)===0).sort((a,b)=>seat(a)-seat(b)); // 端数はボタンの左から
    const share=Math.floor(amt/winners.length/1000)*1000;
    let rem=amt-share*winners.length;
    winners.forEach((w,k)=>{const g=share+(k===0?rem:0);w.chips+=g;w.won+=g});
    prev=L;
  }
  cont.forEach(p=>log(`${p.name}：${p.hand.map(cardStr).join(' ')}（${p.hname}）`));
  cont.forEach(p=>(p.tellLog||[]).forEach(t=>{log(`答え合わせ：${p.name}の「${CUE_LABEL[t.cue]}」は${TRUTH_JP[t.truth]}だった`);noteTell(p.name,t.cue,t.truth)}));
  if(CFG.tells||CFG.ch)renderNotes();
  const ag=S.players[S.aggr];
  if(S.aggr>0&&S.lastCalled===S.aggr&&ag&&ag.show&&S.players[0].won>0&&(ag.lastState==='bluff'||isWeak(ag.hand,S.board))){S.reads=(S.reads||0)+1;S.readMsg=true}
  const ws=S.players.filter(p=>p.won>0);
  ws.forEach(w=>log(`${w.name}が ${fmt(w.won)} を獲得`));
  S.msg=ws.map(w=>`${w.name}の勝ち（${w.hname}・+${fmt(w.won)}）`).join(' / ');
  if(S.readMsg){S.readMsg=false;S.msg=`ブラフを見抜いた！ ${S.msg}`;grantTitle('read')}
  const me=S.players[0];
  if(me.show){
    if(me.won>0){
      if(me.score[0]>=7)grantTitle('quads');
      if(me.allIn)grantTitle('allin');
      const loser=cont.filter(q=>!q.human&&!q.won).pop();
      if(loser){loser.say={seq:(loser.actSeq||0)+1000,act:'',line:Math.random()<.5?'ナイスハンド':lineFor(loser.name,'fold')||'ナイスハンド'}}
    }else{
      const ws2=cont.filter(q=>q.won>0);
      if(me.hand[0].r===14&&me.hand[1].r===14)grantTitle('aalose');
      if(me.score[0]>=6)grantTitle('cooler');
      if(S.board.length===5&&ws2.length){const turn=b=>bestN(b.hand.concat(S.board.slice(0,4)));
        if(ws2.every(w=>cmp(turn(me),turn(w))>0))grantTitle('badbeat')}
    }
  }
  payHouse72();
  S.handOver=true;S.toAct=-1;
  if(S.slowrolled>0){const sp=S.players[S.slowrolled];grantTitle('slowrolled');taunt(sp,'gloat');
    jinNote('顔に出すな。ああいう勝ち方をする奴は、もう焦っている',0)}
  else{const g=ws.find(w=>mannerOf(w)&&mannerOf(w).gloat);if(g&&me.show&&!me.won&&Math.random()<.6)taunt(g,'gloat')}
  endHand();
  potFly(pr,potAmt);potCall();
}
function endHand(){
  // ティルト：マナーの悪い相手が、1ハンドで持ち点の3割以上を取られたら熱くなる
  if(S.players[0].won>0)S.players.forEach(q=>{const m=mannerOf(q);if(!m||q.won>0)return;
    if(q.tilt>0&&q.total>=BB()*5)grantTitle('tiltwin');
    if(q.hs&&q.total>=q.hs*.3&&!q.out){const was=q.tilt>0;q.tilt=m.tilt.hands;
      if(!was){q.say={seq:(S.saySeq=(S.saySeq||0)+1)+2000,act:'',line:lineFor(q.name,'tilt')};log(`${q.name}が熱くなっている`);
        jinNote(`${q.name}が熱くなった。強い手で待て`,1)}}});
  S.dryStreak=S.myPreFold?(S.dryStreak||0)+1:0;
  if(S.dryStreak>=8)grantTitle('dry');
  if(S.handNo>=30)grantTitle('onemore');
  if(S.players[0].won>0&&S.players[0].hand.length===2){const rs=S.players[0].hand.map(c=>c.r).sort((a,b)=>a-b);if(rs[0]===2&&rs[1]===7)grantTitle('seven2')}
  const me=S.players[0],opps=S.players.slice(1),g=CFG.goal;
  if(me.chips<=0)S.result='lose';
  else if(opps.every(p=>p.chips<=0)){S.result='win';if(g.type!=='bust'&&g.type!=='free')S.msg=`相手のチップを全部取った！ ${S.msg}`}
  else if(g.type==='steal'&&S.steals>=g.n)S.result='win';
  else if(g.type==='bluff'&&S.bluffs>=g.n)S.result='win';
  else if(g.type==='readcall'&&(S.reads||0)>=g.n)S.result='win';
  if(S.result)log(S.result==='win'?'目標達成':'チップがなくなった',true);
  render();
}

/* ---------- CPU：勝率を見積もり、性格で判断を変える ---------- */
function equity(hand,board,opps,sims){
  const known=hand.concat(board);
  const rest=fullDeck().filter(c=>!known.some(k=>k.r===c.r&&k.s===c.s));
  const need=opps*2+(5-board.length);
  let score=0;
  for(let t=0;t<sims;t++){
    for(let i=0;i<need;i++){const j=i+Math.floor(Math.random()*(rest.length-i));[rest[i],rest[j]]=[rest[j],rest[i]]}
    const b=board.concat(rest.slice(opps*2,need));
    const mine=bestN(hand.concat(b));
    let lose=false,ties=0;
    for(let o=0;o<opps;o++){
      const d=cmp(bestN([rest[o*2],rest[o*2+1]].concat(b)),mine);
      if(d>0){lose=true;break}
      if(d===0)ties++;
    }
    if(!lose)score+=ties?1/(ties+1):1;
  }
  return score/sims;
}
function cpuDecide(i){
  const p=S.players[i],st=styleOf(p);
  const toCall=Math.min(S.currentBet-p.bet,p.chips);
  const opps=S.players.filter(q=>inHand(q)&&q!==p).length;
  const eq=equity(p.hand,S.board,opps,S.street==='preflop'?200:300);
  const pot=potTotal();
  const odds=toCall/(pot+toCall);
  const rel=eq*(opps+1);
  const r=Math.random();
  const canRaise=p.chips>toCall&&S.raises<3&&!p.acted;
  if(canRaise&&(rel>st.hi||(rel>st.mid&&r<st.midP)||(toCall===0&&r<st.bluff))){
    const size=Math.max(S.minRaise,Math.round(pot*(0.5+Math.random()*0.4)/1000)*1000);
    return{type:'raise',to:S.currentBet+size,state:rel>st.hi?'strong':rel<1?'bluff':'none',rel:rel>st.mid};
  }
  if(toCall===0)return{type:'call',state:rel>st.hi?'strong':'none'};
  // 慎重な性格：レイズや賭けを受けたら、強い手以外は降りる
  if(S.street==='preflop'&&S.currentBet>BB()&&st.defPre&&rel<st.defPre)return{type:'fold',state:'none'};
  if(S.street!=='preflop'&&st.defPost&&rel<st.defPost)return{type:'fold',state:'none'};
  if(eq>=odds+st.margin||(toCall<=BB()&&rel>0.8))return{type:'call',state:rel>st.hi?'strong':'none'};
  if(st.loose&&toCall<=BB()*4&&rel>0.5)return{type:'call',state:rel>st.hi?'strong':'none'};
  return{type:'fold',state:'none'};
}

function cpuAct(i){if(S.handOver||S.toAct!==i)return;const d=cpuDecide(i);act(i,d.type,d.to)}

/* ---------- 師匠のひとこと ---------- */
function isLatePos(){
  // ディーラー、またはディーラーの直前の席
  const live=S.players.map((p,i)=>i).filter(i=>!S.players[i].out);
  if(S.dealer===0)return true;
  return live.length>=3&&nextIdx(0,p=>!p.out)===S.dealer;
}
function senseiLine(){
  if(S.jinNote&&S.handNo<=S.jinNote.until)return S.jinNote.t;
  if(!CFG.hint||S.handOver||S.toAct!==0)return'';
  const me=S.players[0],toCall=S.currentBet-me.bet;
  if(CFG.hint==='hand'){
    if(S.street==='preflop'){
      const t=preTier(me.hand);
      if(t===2)return'いい手だ。勝負しろ。';
      if(t===1)return toCall<=BB()?'悪くない。安く入れるなら参加していい。':'悪くない手だが、大きく賭けられたら考えろ。';
      return toCall<=0?'弱い手だ。ただで見られるならチェックでいい。':'弱い手だ。降りろ。ゲンにくれてやれ。';
    }
    return isWeak(me.hand,S.board)?'何もできていない。ゲン相手にブラフは効かんぞ。':'役ができた。ゲンは降りない。しっかり賭けろ。';
  }
  if(CFG.hint==='position'){
    if(S.street!=='preflop')return'盗みはプリフロップで決めろ。ここからは手の強さで勝負だ。';
    const nobodyIn=S.players.every((p,i)=>i===0||p.bet<=BB())&&S.currentBet<=BB();
    if(isLatePos()&&nobodyIn)return'後ろの席で、誰も参加していない。手が弱くてもレイズで盗め。';
    if(isLatePos())return'誰かが先に参加した。盗むのはやめて、強い手だけで行け。';
    return preTier(me.hand)===2?'前の席だが、いい手だ。参加していい。':'前の席は不利だ。強い手以外は降りろ。';
  }
  if(CFG.hint==='tell'){
    if(S.revSaid===S.handNo+':'+S.street)return'……今のは、わざとだ。クセを信じすぎるな。';
    const t=S.players.map((q,j)=>({q,j})).filter(o=>!o.q.human&&o.q.tell&&o.q.tell.street===S.street&&!o.q.folded);
    if(t.length){
      const {q}=t[t.length-1];
      if(S.handNo>=8&&S.handNo%3)return'さっきのクセ、意味は覚えているか。自分で読め。';
      return q.tell.meaning==='strong'?`見たか。${q.name}が${CUE_LABEL[q.tell.cue]}。強いぞ。`
        :`見たか。${q.name}が${CUE_LABEL[q.tell.cue]}。ブラフかもしれん。`;
    }
    if(S.street==='preflop')return'相手の顔を見ろ。賭ける前に、何かが出る。';
    return toCall>0?'相手が賭けてきた。そのとき何が出ていたか思い出せ。':'手がなければ無理するな。チェックで様子を見ろ。';
  }
  if(CFG.hint==='bluff'){
    if(S.street==='preflop')return'フロップを見てから仕掛けろ。安く入れるなら参加していい。';
    const weak=isWeak(me.hand,S.board);
    if(weak&&toCall<=0)return'何もない。だが相手も迷っている。賭けてみろ。';
    if(weak)return'相手が打ってきた。今回は引け。';
    return'手ができた。普通に勝負しろ。';
  }
  return'';
}

function cardHTML(c,hidden,extra){
  if(!c)return'<div class="card slot"></div>';
  if(hidden)return`<div class="card back${extra||''}" aria-label="伏せたカード"></div>`;
  const red=c.s===1||c.s===2;
  const court=c.r>=11&&c.r<=13;
  const mid=court?`<span class="court"><b>${rankStr(c.r)}</b><i>${SUITS[c.s]}</i></span>`:`<span class="s${c.r===14?' ace':''}">${SUITS[c.s]}</span>`;
  return`<div class="card${red?' red':''}${extra||''}" aria-label="${cardStr(c)}"><span class="r">${rankStr(c.r)}<i>${SUITS[c.s]}</i></span>${mid}<span class="r r2">${rankStr(c.r)}<i>${SUITS[c.s]}</i></span></div>`;
}
/* 金額をチップの山に分ける */
const DENOMS=[[100000,'c6'],[50000,'c5'],[10000,'c4'],[5000,'c3'],[2500,'c2'],[1000,'c1']];
function chipStack(amount,label,big,small){
  if(!amount)return'';
  let rest=amount,chips=[];
  for(const [v,cls] of (small?DENOMS.filter(d=>d[0]<=10000):DENOMS)){while(rest>=v&&chips.length<(big?40:24)){chips.push(cls);rest-=v}}
  const cols=[];for(let i=0;i<chips.length;i+=8)cols.push(chips.slice(i,i+8));
  const step=window.innerWidth<620?3:4;
  const html=cols.slice(0,big?5:3).map(col=>`<span class="col" style="height:${11+step*(col.length-1)+4}px">${
    col.map((cls,k)=>`<span class="chip ${cls}" style="bottom:${k*step+4}px;left:${(((k*7+col.length*3)%5)-2)*.5}px"></span>`).join('')}</span>`).join('');
  return`<span class="stack" aria-label="${fmt(amount)}">${html}${label!==false?`<span class="amt-label">${fmt(amount)}</span>`:''}</span>`;
}
function renderGoal(){
  const g=CFG.goal,el=$('goal');
  let main,cnt=null,sub='';
  if(g.type==='free'){main='最後の一人になる';sub='相手全員のチップを取ったら優勝'}
  else{main=CFG.ch.goalText;
    if(g.type!=='bust'){cnt=Math.min(g.type==='steal'?S.steals:g.type==='readcall'?(S.reads||0):S.bluffs,g.n);sub='または、相手全員のチップを取る'}}
  const pips=cnt===null?'':`<span class="pips" aria-label="${cnt}/${g.n}">${Array.from({length:g.n},(_,k)=>`<i class="${k<cnt?'on':''}"></i>`).join('')}<b>${cnt}/${g.n}</b></span>`;
  const key=main+cnt;
  if(el.dataset.k===key)return;

function presetValues(pot,toCall){

/* 奥行き：マウスの位置や端末の傾きで、背景とキャラを別々にずらす */
const Depth=(()=>{
  let tx=0,ty=0,x=0,y=0,raf=0,asked=false,base=null;
  const on=()=>SETTINGS.depth&&!reducedMotion();
  function tick(){
    x+=(tx-x)*.12;y+=(ty-y)*.12;
    // 卓全体の変数を書き換えると全要素のスタイル計算が走って重いので、動かす3つだけに書く
    const t=$('table'),mv=(sel,kx,ky)=>{const el=t.querySelector(sel);if(el)el.style.translate=`${(x*kx).toFixed(1)}px ${(y*ky).toFixed(1)}px`};
    mv('.room',-16,-9);mv('.lamp',-9,-5);mv('.busts',8,3);
    raf=Math.abs(tx-x)+Math.abs(ty-y)>.003?requestAnimationFrame(tick):0;
  }
  function aim(nx,ny){
    if(!on())nx=ny=0;
    tx=Math.max(-1,Math.min(1,nx));ty=Math.max(-1,Math.min(1,ny));
    if(!raf)raf=requestAnimationFrame(tick);
  }
  addEventListener('pointermove',e=>{
    if(e.pointerType!=='mouse')return;
    const r=$('table').getBoundingClientRect();if(!r.width)return;
    aim((e.clientX-r.left)/r.width*2-1,(e.clientY-r.top)/r.height*2-1);
  },{passive:true});
  document.addEventListener('mouseleave',()=>aim(0,0));
  // 傾き：持ち始めの角度を基準にし、持ち方が変わってもゆっくり基準を戻す
  addEventListener('deviceorientation',e=>{
    if(e.gamma==null||e.beta==null)return;
    if(!base)base={b:e.beta,g:e.gamma};
    base.b+=(e.beta-base.b)*.01;base.g+=(e.gamma-base.g)*.01;
    aim((e.gamma-base.g)/18,(e.beta-base.b)/18);
  });
  // iPhone は、タップしたときに傾きの許可を求める必要がある
  function ask(){
    if(asked||!on())return;asked=true;
    const D=window.DeviceOrientationEvent;
    if(D&&typeof D.requestPermission==='function')D.requestPermission().catch(()=>{});
  }
  return{aim,ask,recenter(){base=null}};
})();

$('btnNice').onclick=()=>{const p=S.players[S.taunt];S.taunt=-1;if(p){p.say={seq:(S.saySeq=(S.saySeq||0)+1)+3000,act:'',line:lineFor(p.name,'nice')}}
  log('あなた：「ナイスハンド」');if(bumpNice()>=3)grantTitle('gentle');render()};
$('btnNext').onclick=()=>{
  if(S.result==='win'&&CFG.ch){
    const ch=CFG.ch;saveCleared(ch.no);
    showInterstitial(()=>playScene(ch,ch.outro,showChapters));
  }else if(S.result==='win')startFree();
  else if(S.result==='lose')CFG.ch?startChapter(CFG.ch,true):startFree();
  else startHand();
};
$('btnAlt').onclick=()=>{S.handOver=true;CFG.ch?showChapters():show('title')};
$('btnQuit').onclick=()=>{$('vs').hidden=true;S.handOver=true;S.toAct=-1;CFG.ch?showChapters():show('title')};
$('btnStory').onclick=showChapters;
$('hero').insertAdjacentHTML('afterbegin',avatar('ジン'));
$('senseiAva').innerHTML=avatar('ジン');
$('btnFree').onclick=startFree;
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('title'));
</script>
