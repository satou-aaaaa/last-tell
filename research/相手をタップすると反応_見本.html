<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相手をタップすると反応</title>
<style>
:root{--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c;--gold:#e2b65b;--felt:#1f5a3f;--felt2:#123827}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c}}
:root[data-theme="dark"]{--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
header{padding:20px 16px 6px;max-width:1220px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:.06em}
header p{margin:0 0 8px;color:var(--sub);font-size:.88rem}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--sub)}
.bar button{background:#1d1f28;color:var(--ink);border:1px solid #333645;border-radius:4px;padding:4px 12px;font:inherit;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:12px 16px 32px;max-width:1220px;margin:0 auto}
@media (min-width:820px){body.p .grid{grid-template-columns:1fr 1fr}}
@media (min-width:1180px){body.p .grid{grid-template-columns:1fr 1fr 1fr}}
@media (min-width:1000px){body.d .grid{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid #262833;border-radius:10px;overflow:hidden;min-width:0}
.card.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hd{display:flex;align-items:baseline;gap:8px;padding:10px 12px 2px;flex-wrap:wrap}
.hd b{font-size:1rem}
.tg{font-size:.72rem;padding:1px 7px;border-radius:3px;background:#262833;color:var(--sub)}
.tg.r{background:var(--gold);color:#1a1408;font-weight:700}
.desc{padding:0 12px 8px;font-size:.84rem;color:var(--sub)}
.desc em{color:var(--ink);font-style:normal}
.frame{margin:0 auto 10px;position:relative;overflow:hidden;border-radius:8px;background:#07080b;max-width:calc(100% - 20px);user-select:none}
body.p .frame{width:350px;height:310px}
body.w .frame{width:760px;height:250px}
body.d .frame{width:560px;height:330px}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0,rgba(226,182,91,.12),transparent 60%),linear-gradient(#15161d,#0b0c10 60%)}
.felt{position:absolute;left:-6%;right:-6%;top:60%;bottom:-40%;border-radius:50% 50% 0 0/40% 40% 0 0;background:radial-gradient(ellipse at 50% 20%,#2a7351 0,var(--felt) 40%,var(--felt2) 100%);box-shadow:inset 0 0 0 7px #3a2618,inset 0 0 0 8px #5b3a22,inset 0 14px 40px rgba(0,0,0,.6)}
.phase{position:absolute;left:8px;bottom:6px;font-size:.66rem;letter-spacing:.08em;color:var(--gold);background:rgba(0,0,0,.55);border:1px solid rgba(226,182,91,.35);padding:0 8px;border-radius:3px;z-index:5}
.seat{position:absolute;top:21%;transform:translateX(-50%);width:23%;max-width:110px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
body.w .seat{top:12%;width:13%}
body.d .seat{top:18%;width:18%}
.face{position:relative;transform-origin:50% 85%;transition:filter .3s}
.face svg{display:block;width:100%;height:auto}
.plate{margin:-4px auto 0;width:86%;background:rgba(10,10,14,.86);border:1px solid rgba(226,182,91,.3);border-radius:4px;font-size:.62rem;color:#ddd;line-height:1.35;padding:1px 0;position:relative}
.nm{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);white-space:nowrap;font-size:.62rem;color:var(--gold);background:rgba(0,0,0,.75);padding:0 6px;border-radius:3px;opacity:0;transition:opacity .25s;pointer-events:none}
.nm.on{opacity:1}
.ripple{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:2px solid rgba(226,182,91,.9);pointer-events:none;animation:rp .55s ease-out forwards;z-index:9}
@keyframes rp{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
.say{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:#f4efe4;color:#1a1a1a;font-size:.64rem;line-height:1.35;padding:3px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;transition:opacity .2s;z-index:6;pointer-events:none}
.say::after{content:"";position:absolute;left:50%;bottom:-5px;margin-left:-5px;border:5px solid transparent;border-bottom:0;border-top-color:#f4efe4}
.say.on{opacity:1}
.say.mute{background:rgba(0,0,0,.7);color:#bbb;font-style:italic}
.say.mute::after{border-top-color:rgba(0,0,0,.7)}
.seat.l .say{left:0;transform:translate(0,-100%)}.seat.l .say::after{left:20px}
.seat.r .say{left:auto;right:0;transform:translate(0,-100%)}.seat.r .say::after{left:auto;right:14px}
body.w .say{top:auto;bottom:-6px;transform:translate(-50%,100%)}
body.w .seat.l .say{transform:translate(0,100%)}body.w .seat.r .say{transform:translate(0,100%)}
body.w .say::after{bottom:auto;top:-5px;border:5px solid transparent;border-top:0;border-bottom-color:#f4efe4}
body.w .say.mute::after{border-bottom-color:rgba(0,0,0,.7)}
/* 反応のアニメーション：手札とは関係なく、キャラごとに決まった動き */
.face.look{animation:look 1.4s ease}
@keyframes look{20%,70%{transform:translateY(3px) scale(1.05)}}
.face.glare{animation:glare 1.6s ease}
@keyframes glare{15%,80%{transform:translateY(5px) scale(1.09);filter:brightness(1.12) contrast(1.08)}}
.face.away{animation:away 1.5s ease}
@keyframes away{20%,70%{transform:rotate(-6deg) translateX(-5px);filter:brightness(.85)}}
.face.nod{animation:nod 1s ease}
@keyframes nod{25%{transform:translateY(4px)}50%{transform:translateY(0)}70%{transform:translateY(3px)}}
.face.grin{animation:grin 1.3s ease}
@keyframes grin{20%{transform:rotate(4deg)}45%{transform:rotate(-2deg) translateY(2px)}70%{transform:rotate(3deg)}}
.face.still{animation:still 1.6s ease}
@keyframes still{55%{transform:none}70%,85%{transform:translateX(1.5px)}}
.face.brow{animation:brow 1.4s ease}
@keyframes brow{20%,70%{transform:rotate(-3deg) scale(1.03)}}
.face.cold{filter:brightness(1.05) drop-shadow(0 0 5px rgba(226,182,91,.55))}
.me{position:absolute;left:50%;top:63%;transform:translateX(-50%);font-size:.7rem;color:#f4efe4;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);padding:2px 10px;border-radius:12px;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:6}
.me.on{opacity:1}
.dealer{position:absolute;left:50%;top:62%;transform:translateX(-50%);font-size:.68rem;color:#cfe8d8;background:rgba(0,0,0,.55);padding:2px 10px;border-radius:3px;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:6}
.dealer.on{opacity:1}
.cards{position:absolute;left:50%;top:76%;transform:translateX(-50%);display:flex;gap:4px}
.cards i{display:block;width:22px;height:31px;border-radius:3px;background:linear-gradient(135deg,#7b1424,#4d0b16);border:1px solid #b0213a}
body.w .cards{top:76%}
.hint{position:absolute;right:8px;bottom:6px;font-size:.62rem;color:var(--sub);z-index:5}
.sw{display:flex;gap:6px;justify-content:center;padding:0 12px 10px;flex-wrap:wrap}
.sw button{background:#1d1f28;color:var(--ink);border:1px solid #333645;border-radius:4px;padding:2px 10px;font:inherit;font-size:.78rem;cursor:pointer}
.sw button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.foot{max-width:1220px;margin:0 auto;padding:0 16px 32px;color:var(--sub);font-size:.84rem}
@media (prefers-reduced-motion:reduce){.face{animation:none!important}}
</style>
</head>
<body class="p">
<header>
<h1>相手をタップすると反応する（5案）</h1>
<p>顔をタップすると、相手がこちらに気づいて反応します。見本は自動でタップが進みます。顔を押しても試せます。反応は<b>手札と関係なく</b>、キャラと回数と場面だけで決まります（テルにならない）。名札・チップのタップは今のまま（数える＋名前が出る）。</p>
<div class="bar">画面：<button data-m="p" aria-pressed="true">スマホ縦</button><button data-m="w" aria-pressed="false">スマホ横</button><button data-m="d" aria-pressed="false">PC</button></div>
</header>
<div class="grid" id="grid"></div>
<p class="foot">おすすめ：案1＋案2＋案3（1.0）。案4・案5は公開後。詳しくは research/相手をタップすると反応_提案.md。</p>

function flash(el,cls,ms){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);clearTimeout(el['_t'+cls]);el['_t'+cls]=setTimeout(()=>el.classList.remove(cls),ms)}
function say(seat,txt,ms=1800){const b=seat.querySelector('.say');if(!txt)return;b.textContent=txt;b.classList.toggle('mute',/^（|^……$/.test(txt));flash(b,'on',ms)}
function ripple(fr,seat){const r=document.createElement('div');r.className='ripple';const fb=fr.getBoundingClientRect(),sb=seat.querySelector('.face').getBoundingClientRect();r.style.left=(sb.left-fb.left+sb.width/2)+'px';r.style.top=(sb.top-fb.top+sb.height*.45)+'px';fr.appendChild(r);setTimeout(()=>r.remove(),600)}
function setup(c,o){const fr=c.querySelector('.frame'),seats=[...fr.querySelectorAll('.seat')],me=fr.querySelector('.me'),dl=fr.querySelector('.dealer'),ph=fr.querySelector('.phase');
 const cnt={};let bond=0,auto=0,step=0;
 if(o.mode==='bond')c.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bond=+b.dataset.b;c.querySelectorAll('[data-b]').forEach(x=>x.setAttribute('aria-pressed',x===b));ph.textContent=bond?'顔なじみ':'初めて';seats[0].querySelector('.nm').textContent=bond?'ミサキ':'見知らぬ客'});
 function tap(seat,user){const n=seat.dataset.n,f=seat.querySelector('.face'),r=R[n];ripple(fr,seat);flash(seat.querySelector('.nm'),'on',1800);
  if(user)auto=Date.now()+6000;
  if(o.mode==='anim'){flash(f,r.a,1700);if(n==='クロウ')say(seat,'……',1400)}
  else if(o.mode==='line'){const k=Math.min(cnt[n]=(cnt[n]||0)+1,4);if(k>3){say(seat,'（こちらを見ない）',1400);return}flash(f,r.a,1700);say(seat,r.l[k-1]||'（こちらを見ない）',2000);if(k===3&&!r.l[2])say(seat,'（こちらを見ない）',1400)}
  else if(o.mode==='nh'){const w=+seat.dataset.i===step%4;if(seat.dataset.i==='3'&&!w){flash(f,'away',1500);say(seat,'……次だ（手で払う）',1800);return}
   if(w){me.textContent='あなた：「ナイスハンド」';flash(me,'on',1600);setTimeout(()=>{flash(f,r.a,1600);say(seat,NH[n],2000)},500)}else{flash(f,'nod',1000);say(seat,'（会釈）',1200)}}
  else if(o.mode==='stare'){const k=cnt[n]=(cnt[n]||0)+1;flash(f,r.a,1600);if(k===4){dl.textContent='ディーラー：「お客様、ほどほどに」';flash(dl,'on',2200);if(n!=='ゲン')setTimeout(()=>f.classList.add('cold'),300)}}
  else if(o.mode==='bond'){if(n==='ミサキ'){if(bond){flash(f,'nod',1000);say(seat,'また会ったわね',1800)}else{flash(f,'away',1500)}}else{if(bond){flash(f,'grin',1300);say(seat,'よう、アオ',1800)}else{flash(f,'nod',1000);say(seat,'……どうも',1500)}}}
 }
 seats.forEach(s=>s.onclick=()=>tap(s,true));
 const seq={anim:[0,1,2,3],line:[3,3,3,1,1,1,1,0,2],nh:[0,0,3,1,1],stare:[1,1,1,1],bond:[0,1,'b',0,1,'b']}[o.mode];let p=0,round=0;
 TM.push(setInterval(()=>{if(Date.now()<auto)return;const v=seq[p%seq.length];p++;
  if(p%seq.length===0){Object.keys(cnt).forEach(k=>delete cnt[k]);fr.querySelectorAll('.cold').forEach(x=>x.classList.remove('cold'));round++;if(o.mode==='nh'){step=(step+1)%3;ph.textContent=['ショーダウンの後：ゲンの勝ち','ショーダウンの後：レイカの勝ち','ショーダウンの後：クロウの勝ち'][step]}}
  if(v==='b'){c.querySelectorAll('[data-b]')[bond?0:1].click();return}
  tap(seats[v],false)},1900));
 if(o.mode==='nh')ph.textContent='ショーダウンの後：ゲンの勝ち';
}
document.querySelectorAll('.bar [data-m]').forEach(b=>b.onclick=()=>{document.body.className=b.dataset.m;document.querySelectorAll('.bar [data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));build()});
build();
</script>
</body>
</html>
