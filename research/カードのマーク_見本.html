<title>カードのマーク 見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Noto+Sans+JP:wght@400;700&display=swap">
<style>
/* 卓のフェルトの上に、ゲームと同じ大きさで札を並べて比べる */
:root{--bg:#0d0f14;--panel:#141821;--felt:#11362f;--felt-hi:#1a5146;--ink:#efe9dc;--muted:#9aa1ad;--gold:#e2b65b;--crimson:#d7263d;--cardred:#c8213a;
 --display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;--body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:18px}
h1{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0;letter-spacing:.04em}
p{margin:0;line-height:1.7;color:var(--muted);max-width:65ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;color:var(--ink);background:#232838;border:1px solid #3a4054;border-radius:8px;padding:8px 14px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.opt{background:var(--panel);border:1px solid #232838;border-radius:10px;padding:14px;display:grid;gap:10px}
.opt.rec{border-color:var(--gold)}
.opt h2{font-family:var(--display);font-size:1.1rem;margin:0;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.opt h2 small{font-family:var(--body);font-size:.78rem;color:var(--gold);font-weight:700}
.opt p{font-size:.88rem}
.felt{background:radial-gradient(ellipse at 50% 30%,var(--felt-hi),var(--felt) 70%);border-radius:10px;padding:14px;display:flex;gap:22px;flex-wrap:wrap;align-items:flex-end;overflow:hidden}
.grp{display:grid;gap:6px}.grp span.l{font-size:.72rem;color:#cfe3dc;opacity:.75}
.row{display:flex;gap:5px;align-items:flex-end}
/* ---- 今の札（ゲームの CSS をなぞったもの） ---- */
.card{--cw:50px;width:var(--cw);aspect-ratio:5/7;max-width:100%;position:relative;border-radius:7%/5%;color:#16171c;font-weight:700;line-height:1;
 background:linear-gradient(170deg,#fbf8f0,#ece5d5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12),0 1px 0 #e2dbcb,0 2px 0 #cfc6b2,0 3px 0 #b9af99,0 8px 14px rgba(0,0,0,.55);flex:none}
.card::before{content:"";position:absolute;inset:7%;border-radius:4%/3%;box-shadow:inset 0 0 0 1px currentColor;opacity:.16}
.card.red{color:var(--cardred)}
.card .r{position:absolute;top:5%;left:7%;font-family:Georgia,'Times New Roman',serif;font-weight:700;letter-spacing:-.04em;font-size:calc(var(--cw)*.3);display:grid;justify-items:center;line-height:1}
.card .r i{font-style:normal;font-size:.85em;margin-top:1px}
.card .r2{top:auto;left:auto;bottom:5%;right:7%;transform:rotate(180deg)}
.card .s{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.48)}
.card .s.ace{font-size:calc(var(--cw)*.62)}
.card .court{position:absolute;inset:17% 20%;border:1px solid currentColor;border-radius:3px;display:grid;place-content:center;justify-items:center;background:linear-gradient(160deg,rgba(226,182,91,.28),rgba(226,182,91,.08));line-height:.95}
.card .court b{font-family:Georgia,serif;font-size:calc(var(--cw)*.36)}
.card .court i{font-style:normal;font-size:calc(var(--cw)*.24)}
.sm .card .r2,.sm .card .r i{display:none}
.tilt .card{transform:perspective(300px) rotateX(18deg)}
.hold .card:first-child{transform:rotate(-9deg) translate(10px,4px)}.hold .card:last-child{transform:rotate(8deg) translate(-10px,0)}
/* ---- 案A ジャンボ数字：角の数字とマークを大きく（カジノのジャンボインデックス） ---- */
.A .card .r{top:4%;left:7%;font-size:calc(var(--cw)*.42);letter-spacing:-.06em}
.A .card .r i{font-size:.86em;margin-top:.04em}
.A .card .r2{display:none}
.A .card .s,.A .card .s.ace{place-items:end;padding:0 10% 8% 0;font-size:calc(var(--cw)*.52)}
.A .card .court{inset:auto 9% 8% auto;width:48%;height:44%}
.A .card .court b{display:none}
.A .card .court i{font-size:calc(var(--cw)*.3)}
/* ---- 案B 絵札：小さい枠をやめ、マークを大きく ---- */
.B .card .court{border:0;background:none;inset:auto 7% 6% auto;width:54%;height:50%}
.B .card .court::before{content:"";position:absolute;inset:6%;border:1px solid var(--gold);border-radius:3px;opacity:.7;background:linear-gradient(160deg,rgba(226,182,91,.22),rgba(226,182,91,.04))}
.B .card .court b{display:none}
.B .card .court i{position:relative;font-size:calc(var(--cw)*.42)}
/* ---- 案C 4色 ---- */
.C .card.d{color:#2f7de1}.C .card.c{color:#1d8a45}
/* ---- 案D 小さい札は数字とマークだけを大きく ---- */
.D.sm .card .s,.D.sm .card .court,.D.sm .card .r2{display:none}
.D.sm .card .r{top:50%;left:50%;transform:translate(-50%,-50%);font-size:calc(var(--cw)*.6);letter-spacing:-.06em}
.D.sm .card .r i{display:block;font-size:.66em;margin-top:0}
@keyframes flip{from{transform:perspective(300px) rotateY(90deg);opacity:.3}}
.deal .card{animation:flip .45s cubic-bezier(.2,.8,.3,1.2) both}
@media (prefers-reduced-motion:reduce){.deal .card{animation:none}}
.zoom .felt{zoom:1}
</style>
<div class="wrap">
<h1>カードのマーク 見本</h1>
<p>今の札は、角のマークが 9〜10px、絵札（J・Q・K）のマークは 6px ほどしかありません。♠と♣、♥と♦が見分けにくい原因です。下の札はゲームと同じ大きさ（スマホ縦の場札 40px・PC の場札 50px・手札 72〜84px・相手の見せ札 24px）です。</p>

<div class="bar"><button id="again" type="button">配り直す</button><button id="sz" type="button" aria-pressed="false">2倍で見る</button></div>
<div id="opts" class="wrap"></div>
</div>
<script>
const OPTS=[
 ['now','今の札','','場札は角のマークが小さく、絵札は中の小さい枠にさらに小さいマーク。'],
 ['A','案A ジャンボ数字','','角の数字とマークを大きくする。カジノのポーカー卓で使う「ジャンボインデックス」のトランプと同じ考え方。右下にも大きなマークを1つ置く（下の小さい逆さ数字はやめる）。'],
 ['A B','案A＋B 絵札も大きなマーク','おすすめ','案Aに加えて、絵札の小さい枠をやめ、金の細い枠の中に大きなマークを置く。数字は角の大きな字で読む。'],
 ['A B C','案A＋B＋C 4色をはじめからオン','','♦を青、♣を緑に。設定にすでにある「4色のトランプ」を、はじめからオンにする。オンラインでは定番だが、ライブの卓では2色がふつう。'],
 ['A B D','案A＋B＋D 小さい札は数字とマークだけ','おすすめに足せる','相手の見せ札・6人卓の小さい札（24px 以下）は、数字とマークだけを真ん中に大きく出す。'],
];
const SU=['♠','♥','♦','♣'],SC=['s','h','d','c'],RK={14:'A',13:'K',12:'Q',11:'J',10:'10'};
function card(r,s){const red=s===1||s===2,court=r>=11&&r<=13,rk=RK[r]||String(r);
 const mid=court?`<span class="court"><b>${rk}</b><i>${SU[s]}</i></span>`:`<span class="s${r===14?' ace':''}">${SU[s]}</span>`;
 return `<div class="card ${SC[s]}${red?' red':''}"><span class="r">${rk}<i>${SU[s]}</i></span>${mid}<span class="r r2">${rk}<i>${SU[s]}</i></span></div>`}
const BOARD1=[[8,0],[8,3],[13,1],[7,0],[11,2]],BOARD2=[[14,0],[13,3],[12,1],[13,0],[10,2]];
function grp(label,cls,cw,cards){return `<div class="grp"><span class="l">${label}</span><div class="row ${cls}" style="--cwv:${cw}px">${cards.map(c=>card(...c)).join('')}</div></div>`}
function render(){document.getElementById('opts').innerHTML=OPTS.map(([k,t,tag,d])=>`<section class="opt${tag==='おすすめ'?' rec':''}"><h2>${t}${tag?`<small>${tag}</small>`:''}</h2><p>${d}</p>
<div class="felt deal ${k}">${grp('場札（スマホ縦 40px）','tilt '+k,40,BOARD1)}${grp('場札（PC 50px）','tilt '+k,50,BOARD2)}${grp('手札（72px）','hold '+k,72,[[9,3],[2,1]])}${grp('相手の見せ札（24px）','sm '+k,24,[[13,3],[13,0]])}${grp('（22px）','sm '+k,22,[[12,2],[12,1]])}</div></section>`).join('');
 document.querySelectorAll('.row').forEach(r=>r.querySelectorAll('.card').forEach((c,i)=>{c.style.setProperty('--cw',(parseFloat(r.style.getPropertyValue('--cwv'))*(big?2:1))+'px');c.style.animationDelay=(i*.12)+'s'}))}
let big=false;render();
document.getElementById('again').onclick=render;
document.getElementById('sz').onclick=e=>{big=!big;e.currentTarget.setAttribute('aria-pressed',big);render()};
</script>
