<title>あの日の卓 見本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* ゲーム本体と同じ暗い卓の世界に固定。左に説明、右にスマホの卓 */
:root{
  --bg:#0c1118; --panel:#141b26; --line:#263244; --fg:#e8e4da; --mute:#8f9aab;
  --brass:#e2b65b; --felt:#0f3b2e; --sepia:#3a2c1c; --red:#d0485a;
  --disp:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.75;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:24px}
h1{font-family:var(--disp);font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:.06em;margin:0;text-wrap:balance}
header p{color:var(--mute);margin:.4em 0 0;max-width:62ch}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button,.sub button{font:inherit;font-size:14px;background:transparent;color:var(--mute);border:1px solid var(--line);padding:7px 13px;border-radius:2px;cursor:pointer}
nav button[aria-selected="true"],.sub button[aria-selected="true"]{color:var(--bg);background:var(--brass);border-color:var(--brass);font-weight:700}
.sub{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.sub button{font-size:13px;padding:4px 10px}
button:focus-visible,.screen:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.star{font-size:11px;margin-left:4px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
@media (max-width:820px){.stage{grid-template-columns:minmax(0,1fr)}}
.desc h2{font-family:var(--disp);font-size:24px;margin:0 0 6px}
.desc p,.desc li{max-width:60ch}
.desc .how{color:var(--mute);font-size:13px;border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.tbl{overflow-x:auto}table{border-collapse:collapse;font-size:13px;width:100%}td,th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}th{color:var(--mute);font-weight:400}
.phone{width:100%;max-width:380px;margin:0 auto;border:1px solid var(--line);border-radius:22px;background:#06090e;padding:10px}
.screen{position:relative;aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#0a0e14;transition:filter .8s}
.screen.past{filter:sepia(.75) saturate(.8) brightness(.95)}
.replay{display:block;margin:10px auto 2px;font:inherit;font-size:12px;color:var(--mute);background:none;border:1px solid var(--line);padding:3px 12px;border-radius:2px;cursor:pointer}
/* 卓 */
.cap{position:absolute;top:10px;left:0;right:0;text-align:center;font-family:var(--disp);letter-spacing:.18em;font-size:13px;color:var(--brass);z-index:3}
.cap small{display:block;color:var(--mute);font-size:11px;letter-spacing:.1em}
.felt{position:absolute;left:8%;right:8%;top:20%;height:46%;border-radius:48%/40%;background:radial-gradient(circle at 50% 40%,#17573f,var(--felt) 70%);border:6px solid #2a1c12;box-shadow:inset 0 0 30px #0008}
.seat{position:absolute;left:50%;transform:translateX(-50%);display:grid;justify-items:center;gap:3px;z-index:2}
.seat.top{top:11%}.seat.bot{top:62%}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:19px;color:#111;border:2px solid #0008;position:relative}
.av .scar{position:absolute;right:9px;bottom:9px;width:9px;height:2px;background:#7a2b2b;transform:rotate(-30deg)}
.av .hand{position:absolute;right:-6px;bottom:-4px;width:16px;height:16px;border-radius:50%;background:#e4c3a6;border:1px solid #0006;transition:transform .6s,opacity .6s}
.av .hand.free{transform:translate(14px,14px);opacity:.25}
.nm{font-size:12px}
.cards{display:flex;gap:4px}
.cd{width:30px;height:42px;border-radius:3px;background:#f4f1ea;color:#111;font-weight:700;font-size:13px;display:grid;place-items:center;line-height:1;border:1px solid #0005;transition:transform .4s}
.cd.r{color:var(--red)}
.cd.back{background:repeating-linear-gradient(45deg,#5a1830 0 4px,#3a1020 4px 8px)}
.board{position:absolute;top:38%;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:2}
.board .cd.empty{background:#ffffff10;border:1px dashed #ffffff30}
.pot{position:absolute;top:31%;left:50%;transform:translateX(-50%);font-size:11px;color:#d8f0e4;z-index:2}
.street{white-space:nowrap;position:absolute;top:51%;left:50%;transform:translateX(-50%);font-size:11px;color:#bfe3d0;letter-spacing:.2em;z-index:2}
/* 会話 */
.talk{position:absolute;left:10px;right:10px;bottom:10px;z-index:6;background:#07090dee;border:1px solid var(--brass);border-radius:3px;padding:12px 14px 22px;min-height:104px;cursor:pointer}
.talk .tn{position:absolute;top:-12px;left:12px;background:var(--brass);color:var(--bg);font-weight:700;font-size:12px;padding:1px 10px;border-radius:2px}
.talk .tx{font-size:14px;line-height:1.7}.talk .tx.narr{color:#d6cdbb;font-family:var(--disp)}
.talk .nx{position:absolute;right:10px;bottom:4px;font-size:10px;color:var(--mute)}
.choice{position:absolute;left:10px;right:10px;bottom:128px;z-index:7;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice button{font:inherit;font-weight:700;background:#07090dee;color:var(--fg);border:1px solid var(--brass);padding:10px;border-radius:2px;cursor:pointer}
/* 看板の棚 */
.shelf{position:absolute;top:58px;left:12px;right:12px;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;z-index:3}
.sg{border:1px solid var(--brass);color:var(--brass);font-family:var(--disp);font-size:11px;text-align:center;padding:6px 2px;border-radius:2px;background:#1a140c;transition:transform .9s cubic-bezier(.5,0,.3,1),opacity .9s}
.sg.empty{border-style:dashed;color:var(--mute);background:none}
.sg.gone{transform:translateY(150px) scale(.8);opacity:0}
.sg.back{animation:ret .9s}
@keyframes ret{from{transform:translateY(150px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>あの日の卓　見本</h1>
    <p>物語の山場を、勝負の最中に起こす3つの案です。右の画面を押すと進みます。</p>
  </header>
  <nav role="tablist" id="tabs"></nav>
  <section class="stage">
    <div class="desc" id="desc"></div>
    <div class="phone"><div class="screen" id="screen" tabindex="0" aria-live="polite"></div><button class="replay" id="replay">最初から見る</button></div>
  </section>
</div>

<script>
const $=s=>document.querySelector(s),scr=$('#screen');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={'ジン':'#e2b65b','若き日のジン':'#e2b65b','ロク':'#e0344a','セキ':'#7fc8ff','レイカ':'#e2b65b','クロウ':'#c9d3e0','ハヤト':'#e9e6df','アオ':'#2fb39a'};
const card=c=>c==='?'?'<span class="cd back"></span>':c===''?'<span class="cd empty"></span>':`<span class="cd${/[♥♦]/.test(c)?' r':''}">${c}</span>`;

/* ---- 会話の窓 ---- */
let Q=[],typing=null,run=0;
function step(){
  const old=scr.querySelector('.talk');
  if(typing){clearInterval(typing);typing=null;const t=old&&old.querySelector('.tx');if(t){t.textContent=t.dataset.f;return}}
  if(!Q.length){old&&old.remove();return}
  const s=Q.shift();
  if(typeof s==='function'){old&&old.remove();s();return}
  const [n,t]=s,b=old||Object.assign(document.createElement('div'),{className:'talk'});
  b.innerHTML=(n?`<span class="tn">${esc(n)}</span>`:'')+`<div class="tx${n?'':' narr'}"></div><span class="nx">押して進む ▼</span>`;
  if(!old)scr.appendChild(b);
  const tx=b.querySelector('.tx');tx.dataset.f=t;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){tx.textContent=t;return}
  let i=0;typing=setInterval(()=>{tx.textContent=t.slice(0,++i);if(i>=t.length){clearInterval(typing);typing=null}},32);
}
function play(seq){Q=seq.slice();step()}
scr.addEventListener('click',e=>{if(e.target.closest('.talk'))step()});
scr.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&scr.querySelector('.talk')){e.preventDefault();step()}});

/* ---- 卓 ---- */
const T={};
function table(o){
  Object.assign(T,{board:['','','','',''],street:'プリフロップ',pot:''},o);
  scr.innerHTML=`<div class="cap">${esc(o.cap)}<small>${esc(o.sub||'')}</small></div><div class="felt"></div>
   <div class="seat top" id="top"></div><div class="pot" id="pot"></div><div class="board" id="board"></div><div class="street" id="st"></div><div class="seat bot" id="bot"></div>`;
  scr.classList.toggle('past',!!o.past);draw();
}
function seat(n,cards,scar){return `<div class="cards">${cards.map(card).join('')}</div><span class="av" style="background:${COL[n]||'#888'}">${esc(n.replace('若き日の','')[0])}${scar?`<span class="scar"></span><span class="hand${T.free?' free':''}" id="hand"></span>`:''}</span><span class="nm">${esc(n)}</span>`}
function draw(){
  $('#top').innerHTML=seat(T.opp,T.oppCards,T.scar);
  $('#bot').innerHTML=seat(T.me,T.myCards).replace(/(<div class="cards">.*?<\/div>)(.*)/s,'$2$1');
  $('#board').innerHTML=T.board.map(card).join('');$('#pot').textContent=T.pot;$('#st').textContent=T.street;
}
const set=o=>()=>{Object.assign(T,o);draw();step()};
function choose(q,a,b,after){return()=>{const c=document.createElement('div');c.className='choice';
  c.innerHTML=`<p style="grid-column:1/-1;margin:0;text-align:center;font-family:var(--disp)">${esc(q)}</p><button>${esc(a)}</button><button>${esc(b)}</button>`;
  scr.appendChild(c);c.querySelectorAll('button').forEach((x,i)=>x.onclick=e=>{e.stopPropagation();c.remove();Q=after(i).concat(Q);step()})}}

/* ================= 案1：あの日を、全員の席から ================= */
const SEATS={
 2:{who:'ロク',sub:'第2章のあとに打つ　決勝の前の練習卓',run(){
   table({cap:'あの日　ロクの席',sub:'十五年前　王冠の控え室',past:1,opp:'若き日のジン',oppCards:['?','?'],me:'ロク',myCards:['Q♠','Q♦'],scar:1,pot:'練習の卓'});
   play([['','決勝の前。ジンとロクは、いつものように控え室で一手だけ打った。'],set({board:['K♣','7♦','2♠','',''],street:'フロップ'}),
    ['若き日のジン','……行くぞ'],['','ジンが大きく賭けた。いつもより、少しだけ早い。'],
    choose('ロクとして','降りる','受ける',i=>i?[['','受けた。ジンの手はAK。ロクの負けだった。']]:[['','降りた。ジンは手を見せずにカードを戻した。']]),
    ['ロク','（今日のこいつは、いつもと違う。……言うべきか）'],['','ロクは何も言わなかった。'],
    ['','──十五年後、ロクは言う。「降りろと言えなかったのは、俺だ」']]);}},
 3:{who:'セキ',sub:'第3章のあとに打つ　準決勝',run(){
   table({cap:'あの日　セキの席',sub:'十五年前　王冠の準決勝',past:1,opp:'若き日のジン',oppCards:['?','?'],me:'セキ',myCards:['A♥','J♥'],scar:1,pot:'準決勝'});
   play([set({board:['A♣','9♠','4♥','',''],street:'フロップ'}),['','Aが落ちた。セキにはトップペアがある。'],
    set({board:['A♣','9♠','4♥','6♠',''],street:'ターン'}),['','ジンが、黙って全部のチップを前に出した。'],
    choose('セキとして','降りる','受ける',i=>i?[['','受けた。ジンの手は9と4。ツーペア。セキはここで終わった。']]:[['','降りた。ジンは手を開かなかった。']]),
    ['セキ','（あの日、私はジン君の手を見ようともしなかった）'],
    ['','──十五年後、セキは言う。「私は降りすぎた。ジン君は降りなさすぎた」']]);}},
 4:{who:'レイカ',sub:'第4章のあとに打つ　決勝の最後の一手',run(){
   table({cap:'あの日　レイカの席',sub:'十五年前　ディーラー席から',past:1,opp:'若き日のジン',oppCards:['Q♠','J♠'],me:'クロウ',myCards:['9♥','9♣'],scar:1,pot:'決勝　最後の一手'});
   play([['','見習いのレイカは、決勝の最後の一手を配った。ディーラー席からは、二人の手札が見える。'],
    set({board:['A♠','7♠','2♦','4♣','K♥'],street:'リバー'}),['','ジンの手は、何もできていない。ブラフだ。'],
    ['','ジンは賭けた。指は、いつものように顎の傷に触れている。'],
    ['レイカ','（ジンさんの指は、強い手のときだけ傷から離れる。……配りながら、ずっと見てきた）'],
    ['','クロウは、ほとんど迷わずにコールした。まるで、答えを知っているように。'],
    ['レイカ','（このクセを知っているのは、ジンさんと、もう一人だけのはず）'],
    ['','──十五年後、レイカは言う。「ジンさんにもクセがあった。誰も知らないはずのね」']]);}},
 6:{who:'クロウ',sub:'第6章のあとに打つ　同じ最後の一手を、クロウの席から',run(){
   table({cap:'あの日　クロウの席',sub:'十五年前　王冠の決勝',past:1,opp:'若き日のジン',oppCards:['?','?'],me:'クロウ',myCards:['9♥','9♣'],scar:1,pot:'決勝　最後の一手'});
   play([set({board:['A♠','7♠','2♦','4♣','K♥'],street:'リバー'}),['','ジンが全部を賭けた。指は、顎の傷に触れている。'],
    ['クロウ','（ハヤト君の言ったとおりなら、傷に触れているのは強くない手です。答えは、もう知っている）'],
    ['','それでも、白い手袋の指先を、一度だけ直した。'],
    choose('クロウとして','コール','降りる',i=>i?[['','降りようとした手を、クロウ自身が止めた。答えを知っている勝負から、降りることはできなかった。']]:[['','コールした。ジンの手はQとJ。何もできていない。クロウの勝ち。']]),
    ['クロウ','（勝った。……いいえ。私は、答えを教えられただけです）'],
    ['','──十五年後、クロウは言う。「ようやく、負けることができました」']]);}},
};
let seatNo=2;
function drawSeats(){$('#sub').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.n===seatNo));SEATS[seatNo].run()}

/* ================= 案2：ボスの最後の一手 ================= */
function drawBoss(){
  table({cap:'第5章　地下の賭場跡',sub:'決着のハンド',opp:'ハヤト',oppCards:['?','?'],me:'アオ',myCards:['A♠','A♦'],pot:'ポット　大'});
  play([set({board:['K♥','8♣','8♦','',''],street:'フロップ'}),['ハヤト','……昔、ここでよく師匠と打った'],
   set({board:['K♥','8♣','8♦','3♠',''],street:'ターン'}),['ハヤト','あの人は、俺には一度もクセを見せなかった'],
   set({board:['K♥','8♣','8♦','3♠','A♣'],street:'リバー'}),['','ハヤトは焦らさずに、すぐに手を表に向けた。'],
   set({oppCards:['K♠','Q♠']}),['ハヤト','……負けか。お前は、見せてもらえるといいな'],
   ['','勝ち方は今のまま。決着のハンドに、ストリートごとの一行が重なるだけ。']]);
}

/* ================= 案3：看板を奪われる ================= */
const SIGNS=['錨亭','銀の扉','月影','天空',''];
function drawSign(){
  scr.classList.remove('past');
  scr.innerHTML=`<div class="cap">第5章　地下の賭場跡<small>看板の棚</small></div><div class="shelf">${SIGNS.map((s,i)=>`<div class="sg${s?'':' empty'}" id="sg${i}">${s||'5枚目'}</div>`).join('')}</div>
   <div class="felt" style="top:34%"></div><div class="board" style="top:48%">${['A♠','A♦'].map(card).join('')}<span style="width:12px"></span>${['K♣','K♦'].map(card).join('')}</div>
   <div class="street" style="top:58%">ボード　7♥ 8♣ 2♠ 5♦ <b style="color:#fff">K♠</b></div>`;
  play([['','最初の一手。あなたのAAは、最後の1枚でハヤトのKKに負けた。'],
   ['ハヤト','看板を持つ者は、挑まれたら断れない。……知ってるだろ'],
   ()=>{$('#sg0').classList.add('gone');setTimeout(step,900)},
   ['ハヤト','錨亭の看板は、預かる'],['','壁際で、テツが目をそらした。'],
   ['','（勝利条件「持ち点を8万に戻す」は今のまま。戻したとき、看板を取り返す）'],
   ()=>{const s=$('#sg0');s.classList.remove('gone');s.classList.add('back');setTimeout(step,900)},
   ['ハヤト','……返す。師匠の店の看板だ。俺が持っていていいものじゃない'],
   ['','その日、錨亭のゲンは閉店まで、空いた壁を見ていた。']]);
}

/* ================= タブ ================= */
const TABS=[
 {k:'案1',t:'あの日を、全員の席から打つ',rec:1,draw:drawSeats,sub:1,body:`<p>いまは第5章で1回だけある「あの日のジンとして1ハンド打つ」回想を、<b>第2〜6章に1つずつ</b>にします。毎章、あの日の決勝の日を、違う人の席から1ハンドだけ打ちます。</p>
  <div class="tbl"><table><tr><th>章</th><th>席</th><th>わかること</th></tr><tr><td>2</td><td>ロク</td><td>ジンの様子がおかしいと気づいていたのに、言えなかった</td></tr><tr><td>3</td><td>セキ</td><td>降りすぎたセキと、降りなさすぎたジン</td></tr><tr><td>4</td><td>レイカ</td><td>ジンの指は傷に触れたまま。クロウは迷わずコールした。クセを知る誰かが教えている</td></tr><tr><td>5</td><td>ジン</td><td>（今のまま）売ったのはハヤト</td></tr><tr><td>6</td><td>クロウ</td><td>答えを知っていたのに、手袋を直して迷った</td></tr><tr><td>7</td><td>自分</td><td>（今のまま）ジンの本当のクセ</td></tr></table></div>
  <p>第7章に来たとき、あの日の卓を全員の席から一度ずつ体験しています。読む側、読まれる側、見ていた側、言えなかった側。そのうえで、最後に自分がジンを読みます。</p>
  <p class="how">回想の1ハンドは勝敗に数えません。各章の勝利条件と難しさはそのままです。上のボタンで席を切り替えられます。</p>`},
 {k:'案2',t:'ボスの最後の一手で話が動く',draw:drawBoss,body:`<p>各章の決着のハンドで、ストリートごとにボスが1行ずつ話します。勝負が決まる瞬間に、その人の本音が出ます。</p><p class="how">勝ち方は今のまま。量は1章3〜4行です。</p>`},
 {k:'案3',t:'看板を一枚、奪われる',draw:drawSign,body:`<p>第5章の始めにあるAAの負けハンドで、錨亭の看板をハヤトに取られます。「看板を持つ者は、挑まれたら断れない」という今ある決まりを、ここで先に見せます。</p><p>勝利条件「持ち点を8万に戻す」はそのままで、達成すると看板を取り返します。</p>`},
];
let cur=0;
function show(i){
  cur=i;Q=[];if(typing){clearInterval(typing);typing=null}T.free=0;
  document.querySelectorAll('#tabs button').forEach((b,j)=>b.setAttribute('aria-selected',j===i));
  const X=TABS[i];
  $('#desc').innerHTML=`<h2>${X.k}　${X.t}</h2>${X.sub?`<div class="sub" id="sub">${[2,3,4,6].map(n=>`<button data-n="${n}">第${n}章　${SEATS[n].who}の席</button>`).join('')}</div>`:''}${X.body}`;
  if(X.sub)$('#sub').querySelectorAll('button').forEach(b=>b.onclick=()=>{seatNo=+b.dataset.n;Q=[];T.free=0;drawSeats()});
  X.sub?drawSeats():X.draw();
}
$('#tabs').innerHTML=TABS.map(X=>`<button role="tab" aria-selected="false">${X.k}　${X.t}${X.rec?'<span class="star">★おすすめ</span>':''}</button>`).join('');
document.querySelectorAll('#tabs button').forEach((b,i)=>b.onclick=()=>show(i));
$('#replay').onclick=()=>show(cur);
show(0);
</script>
