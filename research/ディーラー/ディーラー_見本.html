<title>ディーラーの見本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* layout: 1 column of labelled table films, each a looping hand */
:root{--bg:#0e0d0b;--panel:#17150f;--fg:#ece5d6;--mute:#a89f8c;--gold:#c9a45c;--line:#2c281f;
--disp:"Shippori Mincho","Hiragino Mincho ProN",serif;--body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;color-scheme:dark}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--body);line-height:1.7;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
main{max-width:1100px;margin:0 auto;display:grid;gap:28px}
h1{font-family:var(--disp);font-size:clamp(22px,3vw,30px);margin:0;text-wrap:balance;letter-spacing:.04em}
.lead{color:var(--mute);margin:4px 0 0;max-width:65ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:22px}
figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:grid}
figure.rec{border-color:var(--gold)}
canvas{width:100%;height:auto;display:block;aspect-ratio:16/9;max-width:100%}
figcaption{padding:12px 16px 16px;display:grid;gap:4px;min-width:0}
.tag{font-size:12px;letter-spacing:.12em;color:var(--gold)}
.name{font-family:var(--disp);font-size:19px}
.desc{color:var(--mute);font-size:14px}
.ctl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:13px}
button{font:inherit;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:4px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold)}
</style>
<main>
<header><h1>ディーラーをどう入れるか（見本）</h1>
<p class="lead">同じ 1 ハンド（配る → ベットを集める → フロップ・ターン・リバー → ポットを渡す → 札を集める）を、案ごとに同時に流しています。背景は今の Godot 版の卓の写真。手や人の絵は仮で、本番は 3D です。</p>
<div class="ctl"><button id="pause">止める</button><button id="slow">ゆっくり</button><span>約 11 秒でくり返し</span></div></header>
<div class="grid" id="grid"></div>
</main>
