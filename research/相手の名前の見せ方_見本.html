<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>相手の名前の見せ方</title>
<style>
:root{--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c;--gold:#e2b65b;--crimson:#b0213a;--felt:#1f5a3f;--felt2:#123827;--line:rgba(226,182,91,.35);--plate:rgba(10,10,14,.86)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c}}
:root[data-theme="dark"]{--bg:#0d0e13;--panel:#16171e;--ink:#ece6d6;--sub:#9a968c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;line-height:1.6}
header{padding:20px 16px 6px;max-width:1220px;margin:0 auto}
h1{font-size:1.25rem;margin:0 0 4px;letter-spacing:.06em}
header p{margin:0 0 8px;color:var(--sub);font-size:.88rem}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.82rem;color:var(--sub)}
.bar button{background:#1d1f28;color:var(--ink);border:1px solid #333645;border-radius:4px;padding:4px 12px;font:inherit;cursor:pointer}
.bar button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;padding:12px 16px 32px;max-width:1220px;margin:0 auto}
body.w .grid{grid-template-columns:1fr}
@media (min-width:820px){body.p .grid{grid-template-columns:1fr 1fr}}
@media (min-width:1180px){body.p .grid{grid-template-columns:1fr 1fr 1fr}}
@media (min-width:980px){body.d .grid{grid-template-columns:1fr 1fr}}
.card{background:var(--panel);border:1px solid #262833;border-radius:10px;overflow:hidden;min-width:0}
.card.rec{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.hd{display:flex;align-items:baseline;gap:8px;padding:10px 12px 2px;flex-wrap:wrap}
.hd b{font-size:1rem}
.tg{font-size:.72rem;padding:1px 7px;border-radius:3px;background:#262833;color:var(--sub)}
.tg.r{background:var(--gold);color:#1a1408;font-weight:700}
.desc{padding:0 12px 8px;font-size:.84rem;color:var(--sub)}
.desc em{color:var(--ink);font-style:normal}
.frame{margin:0 auto 12px;position:relative;overflow:hidden;border-radius:8px;background:#07080b;max-width:calc(100% - 20px)}
body.p .frame{width:340px;height:300px}
body.w .frame{width:780px;height:250px}
body.d .frame{width:560px;height:330px}
.room{position:absolute;inset:0;background:radial-gradient(ellipse at 70% 0,rgba(226,182,91,.12),transparent 60%),linear-gradient(#15161d,#0b0c10 60%)}
.felt{position:absolute;left:-6%;right:-6%;top:54%;bottom:-40%;border-radius:50% 50% 0 0/40% 40% 0 0;
  background:radial-gradient(ellipse at 50% 20%,#2a7351 0,var(--felt) 40%,var(--felt2) 100%);
  box-shadow:inset 0 0 0 7px #3a2618,inset 0 0 0 8px #5b3a22,inset 0 14px 40px rgba(0,0,0,.6)}
.seat{position:absolute;transform:translateX(-50%);width:17%;max-width:96px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.av{display:block;width:100%;height:auto}.av .t-sweat,.av .t-hand{opacity:0}
.avw{position:relative;border-radius:50%;transition:filter .3s}
.seat.turn .avw{filter:drop-shadow(0 0 6px rgba(226,182,91,.9))}
.seat.folded .avw{opacity:.45}
.plate{position:relative;margin:-14% auto 0;background:var(--plate);border:1px solid #333645;border-radius:4px;padding:1px 4px 2px;font-size:.68rem;line-height:1.25;white-space:nowrap;min-width:70%;display:inline-block;transition:border-color .3s}
.seat.turn .plate{border-color:var(--gold);background:rgba(60,46,14,.95)}
.plate .nm{display:block;font-weight:800;font-size:.72rem}
.plate .nm.q{font-weight:500;opacity:.5;font-size:.6rem;letter-spacing:.04em}
.plate .nm.no{font-weight:700;color:var(--gold);font-family:ui-monospace,monospace;letter-spacing:.06em}
.plate .nm.lk{font-weight:600;color:#cfc8b6;font-size:.64rem}
.plate .nm.fl{animation:fl .35s ease-out}
@keyframes fl{0%{opacity:0;transform:translateY(3px)}100%{opacity:1}}
.plate .nm.flip{animation:flip .9s ease-out}
@keyframes flip{0%{color:var(--gold);text-shadow:0 0 8px var(--gold)}100%{}}
.plate .ch{display:block;color:#d9d2c0;font-variant-numeric:tabular-nums;font-size:.66rem}
.plate .tag{display:block;font-size:.6rem;color:var(--gold)}
.plate .tag.f{color:var(--sub)}
.pop{position:absolute;left:50%;bottom:100%;transform:translate(-50%,4px);background:rgba(8,8,12,.92);border:1px solid rgba(226,182,91,.7);color:var(--ink);font-size:.66rem;font-weight:700;padding:0 7px;border-radius:3px;white-space:nowrap;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:5}
.pop.on{opacity:1;transform:translate(-50%,-2px)}
.pop.lk{font-weight:600;color:#cfc8b6;border-color:#4a4c58}
.say{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);background:#f4efe2;color:#1b1a17;font-size:.64rem;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .2s;z-index:6;pointer-events:none}
.say.on{opacity:1}
.say b{display:block;font-size:.55rem;color:#7b5d22;letter-spacing:.06em;line-height:1.1}
.dealer{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);background:rgba(8,8,12,.85);border:1px solid rgba(226,182,91,.6);border-radius:4px;padding:2px 12px;font-size:.72rem;white-space:nowrap;opacity:0;transition:opacity .25s;z-index:7}
.dealer.on{opacity:1}
.dealer small{color:var(--sub);margin-right:6px;font-size:.6rem;letter-spacing:.1em}
.cards{position:absolute;left:50%;top:75%;transform:translateX(-50%);display:flex;gap:4px}
.cards i{display:block;width:22px;height:31px;border-radius:3px;background:repeating-linear-gradient(45deg,#8e1b2c 0 3px,#a82237 3px 6px);box-shadow:0 0 0 1.5px #e9e1cf,0 3px 6px rgba(0,0,0,.5)}
.pot{position:absolute;left:50%;top:64%;transform:translateX(-50%);font-size:.7rem;background:rgba(0,0,0,.55);padding:0 10px;border-radius:3px;white-space:nowrap}
.pot b{color:var(--gold);font-variant-numeric:tabular-nums}
.note{max-width:1220px;margin:0 auto;padding:0 16px 24px;color:var(--sub);font-size:.82rem}
body.w .pot{top:72%}body.w .cards{display:none}
@media (prefers-reduced-motion:reduce){.pop,.say,.dealer{transition:none}}
</style>
</head>
<body class="p">
<header>
<h1>相手の名前の見せ方</h1>
<p>全部の見本が同じ手順で同時に動きます（約12秒でくり返し）。席をタップすると、その案でのタップ時の見え方になります。</p>
<div class="bar"><span>画面：</span><button data-v="p" aria-pressed="true">スマホ縦</button><button data-v="w" aria-pressed="false">スマホ横</button><button data-v="d" aria-pressed="false">PC</button></div>
</header>
<main class="grid" id="grid"></main>
<p class="note">名前の代わりの呼び名（「黄色いシャツ」など）は見本用の仮のものです。服や持ち物で呼び、肌や体つきでは呼びません。チップの数の出し方は「所持チップをライブ風に」の結果に合わせて変わります（この見本では今のままの「約10万」）。</p>

style=\"mix-blend-mode:multiply\"/>\n  </g></svg>"};
const P=[
 {n:'ミサキ',look:'青緑の服',x:13,y:4},
 {n:'クワメ',look:'黄色いシャツ',x:31,y:0},
 {n:'アデ',look:'ひげの男',x:50,y:-2},
 {n:'タケル',look:'黒スーツ',x:69,y:0},
 {n:'ケンジ',look:'赤いジャケット',x:87,y:4},
];
const MODES=[
 {k:'now',t:'今のまま',d:'名札に名前・星・チップがいつも出ている。<em>テレビ中継やゲームの画面に近い。</em>'},
 {k:'seat',t:'案1 席の番号で呼ぶ',d:'名前は出さず「2番」など席の番号だけ。ディーラーも番号で呼ぶ。<em>一番ライブらしいが、物語の相手が分かりにくい。</em>'},
 {k:'look',t:'案2 知らない相手は見た目で呼ぶ',d:'初めての相手は「黄色いシャツ」のように服や持ち物で呼ぶ。<em>名乗ったり会話で名前が出たら名前に変わる</em>（見本では8秒ごろにクワメが名乗る）。'},
 {k:'act',t:'案3 ふだんは名前を出さない',d:'名札はチップと行動だけ。<em>声を出した時・動いた時だけ</em>、名札に名前が少し出て消える。タップでも出る。'},
 {k:'quiet',t:'案4 名前を小さく控えめに',d:'名前は残すが、小さく薄く。星も消す。<em>今の作りからの変更が一番少ない。</em>'},
 {k:'intro',t:'案5 座る時にディーラーが紹介',d:'卓に着いた時だけディーラーが「2番の席、ミサキさんです」と順に紹介し、そのあと名前は消える。'},
 {k:'rec',t:'おすすめ 案2＋案3',d:'ふだんは名前なし。動いた時・声を出した時だけ、<em>知っている相手は名前、知らない相手は見た目の呼び名</em>が出る。名乗ると名前に変わる。物語の相手は名乗りのあとなので名前で出る。',rec:true},
];
// 台本（秒）
const T=12;
const EV=[
 {t:1.0,s:0,a:'コール 2,000'},
 {t:2.6,s:1,a:'レイズ 6,000',say:'受けよう'},
 {t:4.2,s:2,a:'フォールド',f:1},
 {t:5.6,s:3,a:'コール 6,000'},
 {t:7.0,s:4,a:'コール 6,000',say:'ついていく！'},
 {t:8.6,s:1,say:'クワメだ。よろしくな',intro:1},
];
const SEATNO=i=>(i+2)+'番';
function uniq(svg,n){const ids=[...new Set([...svg.matchAll(/id="([^"]+)"/g)].map(m=>m[1]))];for(const id of ids)svg=svg.replace(new RegExp(id+'(?![0-9a-z])','g'),id+'_'+n);return svg}
let uid=0;
const cards=MODES.map(m=>{
 const c=document.createElement('section');c.className='card'+(m.rec?' rec':'');
 c.innerHTML=`<div class="hd"><b>${m.t}</b>${m.rec?'<span class="tg r">おすすめ</span>':''}</div><div class="desc">${m.d}</div>
 <div class="frame"><div class="room"></div><div class="felt"></div>
 ${P.map((p,i)=>`<div class="seat" data-i="${i}" style="left:${p.x}%;top:${17+p.y}%"><div class="say"></div><div class="avw">${uniq(AV[p.n],++uid)}</div><div class="plate"><span class="nm"></span><span class="ch">約10万</span><span class="tag"></span></div></div>`).join('')}
 <div class="pot">ポット <b>3,000</b></div><div class="cards"><i></i><i></i></div><div class="dealer"></div></div>`;
 document.getElementById('grid').appendChild(c);
 const st={m:m.k,el:c,seats:[...c.querySelectorAll('.seat')],dealer:c.querySelector('.dealer'),tap:{},known:{}};
 st.seats.forEach((s,i)=>s.addEventListener('click',()=>{st.tap[i]=performance.now()}));
 return st;
});
const t0=performance.now();
function frame(now){
 const t=((now-t0)/1000)%T;
 for(const st of cards){
  const m=st.m;
  // その時点までの出来事
  const last={},say={};let known=false,flipAt=-1,dl='';
  for(const e of EV){if(e.t>t)break;if(e.a)last[e.s]=e;if(e.say&&t-e.t<1.6)say[e.s]=e;if(e.intro){known=true;flipAt=e.t}
   if(e.a&&t-e.t<1.5){dl=(m==='seat'?SEATNO(e.s)+'、':'')+e.a}}
  const next=EV.find(e=>e.t>t&&e.a);
  const introPhase=m==='intro'&&t<4.6;
  st.seats.forEach((s,i)=>{
   const p=P[i],kn=(i===1&&known);
   const nm=s.querySelector('.nm'),tg=s.querySelector('.tag'),sy=s.querySelector('.say'),pl=s.querySelector('.plate');
   const L=last[i];
   s.classList.toggle('turn',!!next&&next.s===i&&t>0.3);
   s.classList.toggle('folded',!!(L&&L.f));
   tg.textContent=L?L.a:'';tg.className='tag'+(L&&L.f?' f':'');
   const tapped=st.tap[i]&&now-st.tap[i]<2000;
   const recent=(L&&t-L.t<1.8)||(say[i]);
   const realOrLook=(m==='rec'||m==='look')&&!kn?p.look:p.n;
   // 名札の名前
   let html='',cls='nm';
   if(m==='now'){html=p.n}
   else if(m==='quiet'){html=p.n;cls+=' q'}
   else if(m==='seat'){html=SEATNO(i);cls+=' no'}
   else if(m==='look'){html=kn?p.n:p.look;cls+=kn?'':' lk';if(kn&&t-flipAt<1)cls+=' flip'}
   else if(m==='intro'){const k=Math.floor((t-0.3)/0.85);html=introPhase&&k>=i?p.n:'';}
   if((m==='act'||m==='rec')&&(recent||tapped)){html=m==='act'?p.n:realOrLook;cls+=(m==='rec'&&!kn?' lk':'')+' fl';if(m==='rec'&&kn&&t-flipAt<1)cls+=' flip'}
   else if((m==='seat'||m==='intro')&&tapped&&!html){html=p.n;cls+=' fl'}
   else if(m==='look'&&tapped&&!kn){}
   if(nm.className!==cls)nm.className=cls;if(nm.innerHTML!==html)nm.innerHTML=html;nm.style.display=html?'':'none';
   // 吹き出し
   const e=say[i];
   if(e){let who='';if((m==='rec'||m==='act')&&!e.intro)who=m==='act'||kn?p.n:p.look;if(m==='seat')who=SEATNO(i);
     const h=(who?`<b>${who}</b>`:'')+e.say;if(sy.innerHTML!==h)sy.innerHTML=h}
   sy.classList.toggle('on',!!e);
   if(e&&e.intro&&(m==='look'||m==='rec')&&t-e.t<0.05){}
  });
  // ディーラー
  let d='';
  if(introPhase){const k=Math.floor((t-0.3)/0.85);if(k>=0&&k<5)d=`<small>ディーラー</small>${SEATNO(k)}の席、${P[k].n}さんです`}
  else if(m==='seat'&&dl)d=`<small>ディーラー</small>${dl}`;
  if(st.dealer.innerHTML!==d&&d)st.dealer.innerHTML=d;st.dealer.classList.toggle('on',!!d);
 }
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.querySelectorAll('.bar button').forEach(b=>b.addEventListener('click',()=>{document.body.className=b.dataset.v;document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',x===b))}));
</script>
